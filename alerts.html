<style>
.camera-view {
    background-color: #0B1220;
    background-image: radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.25), transparent 80%), linear-gradient(to bottom, rgba(11, 18, 32, 0.85), rgba(11, 18, 32, 0.98));
}
body {
    min-height: max(884px, 100dvh);
}
.material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
</style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md relative">

<!-- Background Camera View -->
<div class="absolute inset-0 camera-view z-0"></div>

<!-- Critical Safety Bounding Box -->
<div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
    <div class="border-4 border-error rounded-2xl w-4/5 h-1/2 animate-pulse shadow-[0_0_30px_rgba(255,180,171,0.6)] flex items-start p-4">
        <div class="bg-error-container text-on-error-container font-headline-md text-xl px-4 py-2 rounded-xl shadow-lg border border-error/50">
            🚨 CRITICAL HAZARD — IMMINENT OBSTACLE
        </div>
    </div>
</div>

<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-[touch-target-min] w-full z-50 absolute top-0 bg-background/90 backdrop-blur-md border-b-2 border-error/30">
<div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-error font-headline-lg" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-headline-lg text-headline-lg font-black tracking-tight text-error">AUDIVUE ALERTS</span>
</div>
<div class="flex items-center gap-2 bg-error-container/40 px-4 py-2 rounded-full border border-error/40">
<span class="text-error animate-ping text-sm">●</span>
<span class="font-label-md text-label-md text-on-error-container font-bold">SAFETY INTERRUPT</span>
</div>
</header>

<!-- Main Content Canvas -->
<main class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-end pb-32 px-margin-mobile gap-stack-gap">
<!-- Critical Safety Interrupt Alert Card -->
<div class="bg-error-container/95 backdrop-blur-xl border-2 border-error rounded-2xl p-6 shadow-2xl pointer-events-auto w-full max-w-2xl mx-auto mb-4 flex items-center gap-6">
<div class="bg-error w-14 h-14 rounded-full flex items-center justify-center shrink-0 shadow-lg animate-bounce">
<span class="material-symbols-outlined text-on-error text-4xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="flex-1">
    <div class="text-xs text-on-error-container font-black uppercase tracking-wider mb-1">Preemptive Safety Override</div>
    <p class="font-body-lg text-body-lg text-on-error-container m-0 leading-relaxed font-black">
        "Warning! Open door and obstacle directly ahead, 2 feet!"
    </p>
</div>
</div>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 bg-surface-container/95 backdrop-blur-xl border-t-2 border-error/30 shadow-lg rounded-t-xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl">
<span class="material-symbols-outlined mb-1 text-3xl">visibility</span>
<span class="font-label-lg text-label-lg text-sm">Vision</span>
</button>
<button class="flex flex-col items-center justify-center bg-error-container text-on-error-container rounded-xl h-[touch-target-min] px-6 border-2 border-error scale-98 transition-transform duration-100">
<span class="material-symbols-outlined mb-1 text-3xl" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-lg text-label-lg text-sm font-bold">Alerting</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl">
<span class="material-symbols-outlined mb-1 text-3xl">payments</span>
<span class="font-label-lg text-label-lg text-sm">Currency</span>
</button>
</nav>

<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.1, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakObstacleAlert('Open door and obstacle', 'directly center', 'immediate', true);
        }, 500);
    });
</script>
</body>
</html>
