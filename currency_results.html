<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        @keyframes pulse-box {
            0% { box-shadow: 0 0 0 0 rgba(196, 171, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(196, 171, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(196, 171, 255, 0); }
        }
        .currency-box {
            animation: pulse-box 2s infinite;
        }

        @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up-card {
            animation: slide-up 0.5s ease-out forwards;
        }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }
        .waveform-bar {
            animation: wave 1s infinite ease-in-out;
            transform-origin: bottom;
        }
        .waveform-bar:nth-child(2) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.3s; }
        body { min-height: max(884px, 100dvh); }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">

<!-- Main Content Canvas (Camera View) -->
<main class="flex-grow relative h-screen w-full">
<!-- Live Camera Feed Simulation -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="webcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
<!-- Simulated Camera Interface Grid -->
<div class="absolute inset-0 border-[1px] border-outline/20 pointer-events-none" style="background-image: linear-gradient(to right, rgba(140, 144, 159, 0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(140, 144, 159, 0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>
</div>

<!-- Detected Bounding Boxes overlaying the camera feed -->
<div class="absolute inset-0 z-10 pointer-events-none p-margin-mobile md:p-margin-desktop">
<!-- ₹500 Note Bounding Box -->
<div class="absolute top-[20%] left-[10%] w-[40%] h-[25%] border-2 border-secondary-container bg-secondary-container/10 rounded-lg currency-box flex items-start justify-start p-2">

</div>

<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakCurrencyAlert([500, 200, 100], 800);
        }, 600);
    });
</script>
