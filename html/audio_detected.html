<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Audio Equalizer</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;height:100dvh;overflow:hidden;background:#0B1220;font-family:Inter,sans-serif;}
  canvas#eq-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  .top-bar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .center-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;width:calc(100% - 32px);max-width:400px;background:rgba(12,18,34,0.88);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:28px 24px;text-align:center;}
  .eq-icon{width:68px;height:68px;border-radius:50%;background:rgba(77,142,255,0.14);border:2px solid rgba(77,142,255,0.35);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 28px rgba(77,142,255,0.3);}
  .eq-icon .ms{font-size:34px;color:#4d8eff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;animation:pAnim 2s ease-in-out infinite;}
  @keyframes pAnim{0%,100%{opacity:1}50%{opacity:0.4}}
  .transcript-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;text-align:left;margin:16px 0;}
  .transcript-label{font-size:10px;color:#4d8eff;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px;}
  .transcript-text{font-size:13px;color:#c2c6d6;font-weight:600;font-style:italic;}
  .action-btns{display:flex;gap:10px;}
  .btn-sm{flex:1;height:44px;border:none;border-radius:12px;font-size:13px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;transition:all 0.15s;}
  .btn-sm:active{transform:scale(0.96);}
  .btn-vision{background:#4d8eff;color:#001a42;box-shadow:0 2px 10px rgba(77,142,255,0.3);}
  .btn-vision:hover{background:#5a97ff;}
  .btn-currency{background:rgba(168,85,247,0.2);color:#d0bcff;border:1px solid rgba(168,85,247,0.4);}
  .btn-currency:hover{background:rgba(168,85,247,0.3);}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn.active{background:#adc6ff;color:#001a42;font-weight:700;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
</style>
</head>
<body>
<canvas id="eq-canvas"></canvas>

<!-- Top Bar -->
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(168,85,247,0.14);border:1px solid rgba(168,85,247,0.4);color:#d0bcff;font-family:Inter,sans-serif;">
    <span style="width:7px;height:7px;border-radius:50%;background:#a855f7;display:inline-block;animation:pAnim 1.5s ease-in-out infinite;"></span>AUDIO
  </div>
</header>

<!-- Center Status Card -->
<div class="center-card">
  <div class="eq-icon">
    <span class="ms material-symbols-outlined">graphic_eq</span>
  </div>
  <h2 style="font-size:20px;font-weight:800;color:#e2e2e2;margin:0 0 6px;">Audio Equalizer Active</h2>
  <p id="statusText" style="font-size:13px;color:#8c909f;margin:0 0 14px;line-height:1.5;">Listening for voice commands. Say "obstacle mode" or "currency mode".</p>

  <!-- Live Transcript Box -->
  <div class="transcript-box">
    <div class="transcript-label">Live Voice Transcript</div>
    <div class="transcript-text" id="transcriptText">"Voice commands active. Listening..."</div>
  </div>

  <!-- Action Buttons -->
  <div class="action-btns">
    <button class="btn-sm btn-vision" onclick="window.location.href='env_mode.html'">Vision Mode</button>
    <button class="btn-sm btn-currency" onclick="window.location.href='currency_mode.html'">Currency Mode</button>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'">
    <span class="ms material-symbols-outlined">crisis_alert</span>Alerts
  </button>
  <button class="nav-btn" onclick="window.location.href='currency_mode.html'">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn active">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<style>@keyframes pAnim{0%,100%{opacity:1}50%{opacity:0.4}}</style>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
// WebGL 12-bar Equalizer Shader
(function() {
  const canvas = document.getElementById('eq-canvas');
  const gl = canvas.getContext('webgl');
  if (!gl) return;

  function resize() {
    canvas.width = canvas.clientWidth || innerWidth;
    canvas.height = canvas.clientHeight || innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(canvas);
  }
  window.addEventListener('resize', resize);
  resize();

  const vs = `attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
  const fs = `precision highp float;
  uniform float t; uniform vec2 r;
  void main(){
    vec2 uv=gl_FragCoord.xy/r;
    float bars=12.0; float sp=0.15;
    float idx=floor(uv.x*bars);
    float lx=fract(uv.x*bars);
    if(lx<sp){discard;}
    float h=0.28+0.55*abs(sin(t*4.0+idx*0.9)*cos(t*2.5-idx*0.5));
    float dist=abs(uv.y-0.5);
    if(dist>h*0.48){discard;}
    vec3 blue=vec3(0.19,0.55,1.0);
    vec3 purple=vec3(0.66,0.33,0.97);
    vec3 col=mix(blue,purple,uv.x);
    float glow=0.018/(dist+0.009);
    col+=col*glow*0.6;
    gl_FragColor=vec4(col,1.0);
  }`;

  function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uTime = gl.getUniformLocation(prog, 't');
  const uRes = gl.getUniformLocation(prog, 'r');

  function render(ms) {
    gl.uniform1f(uTime, ms * 0.001);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();

// Voice Assistant + STT
document.addEventListener('DOMContentLoaded', () => {
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    const va = new AudivueVoiceAssistant({
      rate: 1.05, pitch: 1.0,
      onCommandRecognized: (cmd) => {
        document.getElementById('transcriptText').textContent = `"${cmd}"`;
        document.getElementById('statusText').textContent = 'Command received. Processing...';
      },
      onModeChange: (mode) => {
        if (mode === 'obstacle') window.location.href = 'env_mode.html';
        else if (mode === 'currency') window.location.href = 'currency_mode.html';
      }
    });
    va.startListening();
    setTimeout(() => va.speak('Audio equalizer active. Listening for voice commands.', 'high'), 500);
  }
});
</script>
</body>
</html>
