<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Currency Detection Mode</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#000;overflow:hidden;height:100dvh;font-family:Inter,sans-serif;}
  .viewfinder{position:fixed;inset:0;z-index:0;}
  .viewfinder video{width:100%;height:100%;object-fit:cover;opacity:0.45;display:block;}
  .viewfinder::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,18,32,0.72) 0%,transparent 33%,transparent 55%,rgba(11,18,32,0.95) 100%);pointer-events:none;}
  .ar-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .ar-box-violet{position:absolute;border:2.5px solid #a855f7;border-radius:10px;box-shadow:0 0 18px rgba(168,85,247,0.5);}
  .ar-label-violet{position:absolute;top:-30px;left:0;padding:3px 10px;background:#a855f7;border-radius:6px 6px 0 0;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .top-bar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .denom-strip{position:fixed;top:60px;left:0;right:0;z-index:40;padding:10px 14px;display:flex;gap:8px;overflow-x:auto;background:linear-gradient(to bottom,rgba(11,18,32,0.88),transparent);scrollbar-width:none;}
  .denom-strip::-webkit-scrollbar{display:none;}
  .denom-chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;}
  .denom-off{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#6b7280;}
  .denom-on{background:rgba(168,85,247,0.22);border:1px solid #a855f7;color:#d0bcff;}
  .bottom-overlay{position:fixed;bottom:80px;left:0;right:0;z-index:40;padding:0 14px 12px;}
  .caption-card-violet{background:rgba(12,10,22,0.92);backdrop-filter:blur(24px);border:1px solid rgba(168,85,247,0.35);border-left:3.5px solid #a855f7;border-radius:18px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s;}
  .caption-card-violet:hover{border-color:#c084fc;}
  .cap-header{display:flex;align-items:flex-start;gap:12px;}
  .cap-icon-v{width:46px;height:46px;border-radius:50%;background:rgba(168,85,247,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(168,85,247,0.4);}
  .cap-icon-v .ms{font-size:24px;color:#a855f7;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;animation:pAnim 2s ease-in-out infinite;}
  @keyframes pAnim{0%,100%{opacity:1}50%{opacity:0.5}}
  .cap-meta-v{font-size:10px;color:#a855f7;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;}
  .cap-text-v{font-size:15px;font-weight:800;color:#e2e2e2;line-height:1.3;margin:0;}
  .waveform-v{display:flex;align-items:center;gap:3px;height:18px;margin-top:7px;}
  .wv{width:3px;border-radius:2px;background:#a855f7;}
  .wv1{animation:wvA 1s 0s ease-in-out infinite;height:35%;}
  .wv2{animation:wvA 1.2s 0.1s ease-in-out infinite;height:65%;}
  .wv3{animation:wvA 0.9s 0.2s ease-in-out infinite;height:100%;}
  .wv4{animation:wvA 1.1s 0.3s ease-in-out infinite;height:55%;}
  .wv5{animation:wvA 1.3s 0.4s ease-in-out infinite;height:80%;}
  .wv6{animation:wvA 1s 0.15s ease-in-out infinite;height:40%;}
  @keyframes wvA{0%,100%{height:20%}50%{height:100%}}
  .fab-env{position:fixed;bottom:92px;right:16px;z-index:45;width:52px;height:52px;border-radius:16px;border:none;background:#4d8eff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(77,142,255,0.4);transition:all 0.15s;}
  .fab-env:hover{background:#3b7de8;}.fab-env:active{transform:scale(0.95);}
  .fab-env .ms{font-size:26px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn.active{background:#adc6ff;color:#001a42;font-weight:700;}
  .nav-btn.active .ms{font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 24;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
  @media(max-width:360px){.cap-text-v{font-size:13px;}.logo-link h1{font-size:17px;}}
</style>
</head>
<body>

<!-- Live Camera Viewfinder -->
<div class="viewfinder">
  <video id="camFeed" autoplay playsinline muted></video>
</div>

<!-- Currency Note AR Overlays -->
<div class="ar-layer">
  <div class="ar-box-violet" style="top:30%;left:12%;width:28%;height:16%;" id="box500">
    <div class="ar-label-violet">₹500 — 98%</div>
  </div>
  <div class="ar-box-violet" style="top:48%;left:38%;width:26%;height:15%;" id="box200">
    <div class="ar-label-violet">₹200 — 95%</div>
  </div>
  <div class="ar-box-violet" style="top:38%;left:62%;width:24%;height:14%;" id="box100">
    <div class="ar-label-violet">₹100 — 92%</div>
  </div>
</div>

<!-- Top Bar -->
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);font-size:10px;font-weight:700;color:#34d399;font-family:Inter,sans-serif;">
      <span style="width:7px;height:7px;border-radius:50%;background:#34d399;animation:pingDot 1.5s cubic-bezier(0,0,0.2,1) infinite;display:inline-block;"></span>LIVE
    </div>
    <div style="padding:4px 12px;border-radius:20px;background:rgba(168,85,247,0.14);border:1px solid rgba(168,85,247,0.4);font-size:11px;font-weight:700;color:#d0bcff;font-family:Inter,sans-serif;">₹ Currency</div>
  </div>
</header>

<!-- Denomination Strip -->
<div class="denom-strip">
  <span class="denom-chip denom-off">₹10</span>
  <span class="denom-chip denom-off">₹20</span>
  <span class="denom-chip denom-off">₹50</span>
  <span class="denom-chip denom-on">₹100</span>
  <span class="denom-chip denom-on">₹200</span>
  <span class="denom-chip denom-on">₹500</span>
  <span class="denom-chip denom-off">₹2000</span>
</div>

<!-- FAB: Switch to Vision Mode -->
<button class="fab-env" onclick="window.location.href='env_mode.html'" title="Switch to Vision Mode">
  <span class="ms material-symbols-outlined">visibility</span>
</button>

<!-- Currency Caption & Results Card -->
<div class="bottom-overlay">
  <div class="caption-card-violet" onclick="window.location.href='currency_results.html'" title="Tap to view results">
    <div class="cap-header">
      <div class="cap-icon-v"><span class="ms material-symbols-outlined">volume_up</span></div>
      <div style="flex:1;">
        <div class="cap-meta-v">Multi-Note Calculation — Tap for Results</div>
        <p class="cap-text-v" id="currencyText">"500, 200 and 100 rupee notes detected. Total is 800 rupees."</p>
        <div class="waveform-v">
          <div class="wv wv1"></div><div class="wv wv2"></div><div class="wv wv3"></div>
          <div class="wv wv4"></div><div class="wv wv5"></div><div class="wv wv6"></div>
        </div>
      </div>
    </div>
    <!-- Total Amount Summary -->
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(168,85,247,0.2);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#8c909f;">Calculated Total</span>
      <span style="font-size:24px;font-weight:900;color:#d0bcff;letter-spacing:-0.01em;">TOTAL: ₹800</span>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'">
    <span class="ms material-symbols-outlined">crisis_alert</span>Alerts
  </button>
  <button class="nav-btn active" title="Currency Mode">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<style>
  @keyframes pingDot{75%,100%{transform:scale(2);opacity:0;}}
</style>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      document.getElementById('camFeed').srcObject = stream;
    }
  } catch (e) {
    document.getElementById('camFeed').parentElement.style.background = 'radial-gradient(circle at 50% 50%,rgba(50,20,80,0.9),#0B1220)';
  }

  if (typeof AudivueVoiceAssistant !== 'undefined') {
    const va = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
    setTimeout(() => va.speakCurrencyAlert([500, 200, 100], 800), 700);
  }

  // Subtle AR jitter
  let tick = 0;
  setInterval(() => {
    tick += 0.04;
    const b500 = document.getElementById('box500');
    const b200 = document.getElementById('box200');
    if (b500) b500.style.top = (30 + Math.sin(tick * 0.9) * 0.4) + '%';
    if (b200) b200.style.left = (38 + Math.sin(tick * 1.1) * 0.3) + '%';
  }, 60);
});
</script>
</body>
</html>
