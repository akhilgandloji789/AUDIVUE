<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Currency Detection & Summation Mode</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { margin:0; background:#0B1220; height:100dvh; overflow:hidden; font-family:Inter,sans-serif; user-select:none; }
  .view-container { position:relative; width:100vw; height:100dvh; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#050911; }
  video#camFeed { width:100%; height:100%; object-fit:cover; }
  .ar-overlay { position:absolute; inset:0; pointer-events:none; z-index:10; }
  
  .ar-box {
    position:absolute; border:2.5px solid #a855f7; border-radius:12px;
    background:rgba(168,85,247,0.12); box-shadow:0 0 20px rgba(168,85,247,0.4);
    transition:all 0.1s ease-out; pointer-events:none;
  }
  .ar-label {
    position:absolute; top:-32px; left:0; background:rgba(15,23,42,0.92);
    border:1px solid rgba(168,85,247,0.5); backdrop-filter:blur(10px);
    color:#e2e2e2; font-size:12px; font-weight:700; padding:4px 10px;
    border-radius:8px; white-space:nowrap; display:flex; align-items:center; gap:6px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .ar-dot { width:7px; height:7px; border-radius:50%; background:#a855f7; }

  /* Top Bar Header */
  .top-header {
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; height:64px; background:rgba(11,18,32,0.85);
    backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#adc6ff; }
  .brand .ms { font-size:28px; }
  .brand h1 { font-size:20px; font-weight:900; margin:0; letter-spacing:-0.02em; }

  .mode-badge {
    display:flex; align-items:center; gap:8px; padding:6px 14px; border-radius:20px;
    background:rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.35);
    color:#d0bcff; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    cursor:pointer; transition:all 0.15s;
  }
  .mode-badge:hover { background:rgba(168,85,247,0.25); }

  .header-actions { display:flex; align-items:center; gap:10px; }
  .icon-btn {
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06); color:#e2e2e2; display:flex; align-items:center;
    justify-content:center; cursor:pointer; transition:all 0.15s;
  }
  .icon-btn:hover { background:rgba(255,255,255,0.12); }

  /* Bottom Telemetry Card */
  .bottom-overlay {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:640px; z-index:50; pointer-events:none;
  }
  .caption-card {
    background:rgba(15,23,42,0.92); border:1px solid rgba(168,85,247,0.3);
    backdrop-filter:blur(24px); border-radius:20px; padding:16px 20px;
    box-shadow:0 12px 36px rgba(0,0,0,0.5); pointer-events:auto;
    display:flex; align-items:center; gap:16px;
  }
  .cap-icon {
    width:44px; height:44px; border-radius:50%; background:rgba(168,85,247,0.18);
    border:1px solid rgba(168,85,247,0.35); display:flex; align-items:center;
    justify-content:center; color:#a855f7; flex-shrink:0;
  }
  .cap-meta { font-size:10px; font-weight:700; color:#d0bcff; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px; }
  .cap-text { font-size:15px; font-weight:700; color:#e2e2e2; margin:0; line-height:1.4; }
  .sum-badge {
    font-size:18px; font-weight:900; color:#34d399; background:rgba(52,211,153,0.12);
    padding:6px 14px; border-radius:12px; border:1px solid rgba(52,211,153,0.3);
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="view-container">
  <video id="camFeed" autoplay playsinline muted></video>
  <div class="ar-overlay" id="arLayer"></div>
</div>

<header class="top-header">
  <a class="brand" href="index.html">
    <span class="ms material-symbols-outlined">payments</span>
    <h1>AUDIVUE</h1>
  </a>

  <div class="mode-badge" onclick="window.location.href='env_mode.html'" title="Click to switch to Obstacle Mode">
    <span style="width:7px;height:7px;border-radius:50%;background:#a855f7;display:inline-block;"></span>
    Currency Mode
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="muteBtn" title="Mute / Unmute voice">
      <span class="ms material-symbols-outlined" id="muteIcon">volume_up</span>
    </button>
    <div style="position:relative;">
      <button class="icon-btn" id="profileBtn" title="Profile / Account" style="background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.35);">
        <span class="ms material-symbols-outlined" style="color:#d0bcff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">account_circle</span>
      </button>

      <!-- Profile Dropdown Menu -->
      <div id="profileDropdown" style="display:none;position:absolute;top:48px;right:0;width:240px;background:rgba(12,17,30,0.96);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:100;font-family:Inter,sans-serif;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08);">
          <div style="width:38px;height:38px;border-radius:50%;background:rgba(168,85,247,0.2);display:flex;align-items:center;justify-content:center;color:#a855f7;font-weight:700;font-size:16px;" id="userAvatar">A</div>
          <div style="overflow:hidden;text-align:left;">
            <div style="font-size:14px;font-weight:700;color:#e2e2e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="userName">Akhil Gandloji</div>
            <div style="font-size:11px;color:#8c909f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="userEmail">akhilgandloji789@gmail.com</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#34d399;font-weight:700;margin-bottom:14px;background:rgba(52,211,153,0.1);padding:4px 8px;border-radius:8px;">
          <span style="width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;"></span>Firebase Auth Active
        </div>
        <button id="logoutBtn" onclick="handleGoogleSignOut()" style="width:100%;height:40px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:#f87171;font-weight:700;font-size:13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;">
          <span class="ms material-symbols-outlined" style="font-size:18px;">logout</span>Sign Out / Logout
        </button>
      </div>
    </div>
  </div>
</header>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../assets/firebase_auth.js"></script>
<script src="../voice_assistant/voice_assistant.js"></script>

<!-- Spatial Caption Card -->
<div class="bottom-overlay">
  <div class="caption-card">
    <div class="cap-icon"><span class="ms material-symbols-outlined">payments</span></div>
    <div style="flex:1;">
      <div class="cap-meta">Currency Denomination Summation</div>
      <p class="cap-text" id="captionText">"Point camera at currency notes to calculate total..."</p>
    </div>
    <div class="sum-badge" id="totalSumBadge">₹0</div>
  </div>
</div>

<script>
let va = null, isMuted = false;

document.addEventListener('DOMContentLoaded', async () => {
  // Start webcam
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      document.getElementById('camFeed').srcObject = stream;
    }
  } catch (e) {
    document.getElementById('camFeed').parentElement.style.background = 'radial-gradient(circle at 50% 50%,rgba(40,30,80,0.9),#0B1220)';
  }

  // Voice assistant initialization
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    va = new AudivueVoiceAssistant({
      rate: 1.05, pitch: 1.0, defaultMode: 'currency',
      onModeChange: (mode) => {
        if (mode === 'obstacle') window.location.href = 'env_mode.html';
      }
    });
    va.startListening();
  }

  // Profile dropdown menu toggle & user profile setup
  const profileBtn = document.getElementById('profileBtn');
  const profileDropdown = document.getElementById('profileDropdown');
  if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.style.display = profileDropdown.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', () => {
      profileDropdown.style.display = 'none';
    });
  }

  // Populate Firebase / User details
  if (typeof getAudivueUser === 'function') {
    const u = getAudivueUser();
    if (u) {
      if (document.getElementById('userName')) document.getElementById('userName').textContent = u.name;
      if (document.getElementById('userEmail')) document.getElementById('userEmail').textContent = u.email;
      if (document.getElementById('userAvatar')) document.getElementById('userAvatar').textContent = u.name.charAt(0).toUpperCase();
    }
  }

  // Mute button
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (!va) return;
    isMuted = va.toggleMute();
    document.getElementById('muteIcon').textContent = isMuted ? 'volume_off' : 'volume_up';
    document.getElementById('muteBtn').style.background = isMuted ? 'rgba(255,180,171,0.15)' : 'rgba(255,255,255,0.07)';
  });

  const videoEl = document.getElementById('camFeed');
  const arLayer = document.getElementById('arLayer');
  const captionEl = document.getElementById('captionText');
  const sumBadgeEl = document.getElementById('totalSumBadge');
  const hiddenCanvas = document.createElement('canvas');
  const hiddenCtx = hiddenCanvas.getContext('2d');

  let lastSpokenText = "";
  let lastSpokenTime = 0;

  function handleDetectionData(data) {
    if (data.status === 'success' && Array.isArray(data.detections)) {
      arLayer.innerHTML = '';

      if (data.detections.length === 0) {
        captionEl.textContent = '"Point camera at currency notes to calculate total..."';
        sumBadgeEl.textContent = '₹0';
        lastSpokenText = "";
        return;
      }

      let totalSum = 0;
      data.detections.forEach(det => {
        // Extract denomination number from label (e.g., "500 RUPEES" -> 500)
        const match = det.label.match(/\d+/);
        if (match) {
          totalSum += parseInt(match[0], 10);
        }

        const box = document.createElement('div');
        box.className = 'ar-box';
        box.style.top = det.bbox_pct.top + '%';
        box.style.left = det.bbox_pct.left + '%';
        box.style.width = det.bbox_pct.width + '%';
        box.style.height = det.bbox_pct.height + '%';
        box.innerHTML = `<div class="ar-label"><span class="ar-dot"></span>${det.label} — ${Math.round(det.confidence * 100)}%</div>`;
        arLayer.appendChild(box);
      });

      sumBadgeEl.textContent = `₹${totalSum}`;

      const now = Date.now();
      const spoken = data.spoken_summary || `Detected currency notes — Total ${totalSum} rupees`;
      if (spoken && (spoken !== lastSpokenText || (now - lastSpokenTime) > 8000)) {
        captionEl.textContent = `"${spoken}"`;
        if (va && !isMuted) {
          va.speak(spoken, 'normal');
        }
        lastSpokenText = spoken;
        lastSpokenTime = now;
      }
    }
  }

  // Connect WebSocket & REST API to FastAPI Currency ML Server
  let ws = null;
  let isSendingRest = false;

  function getBackendWsUrls() {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      return [
        `ws://localhost:8000/ws/detect`,
        `wss://audivue-backend-kray.onrender.com/ws/detect`
      ];
    }
    return [
      `wss://audivue-backend-kray.onrender.com/ws/detect`,
      `ws://localhost:8000/ws/detect`
    ];
  }

  let backendIdx = 0;
  function initWebSocket() {
    const urls = getBackendWsUrls();
    const targetUrl = urls[backendIdx % urls.length];
    
    try {
      ws = new WebSocket(targetUrl);
      ws.onopen = () => console.log('[AUDIVUE] Currency WebSocket stream connected:', targetUrl);
      ws.onmessage = (evt) => {
        try {
          const data = JSON.parse(evt.data);
          handleDetectionData(data);
        } catch(e){}
      };
      ws.onerror = () => { backendIdx++; };
      ws.onclose = () => { backendIdx++; setTimeout(initWebSocket, 2000); };
    } catch (e) {
      backendIdx++;
      setTimeout(initWebSocket, 2000);
    }
  }
  initWebSocket();

  // Dual Frame Streamer for Currency ML Model (12 FPS) + REST Fallback
  setInterval(async () => {
    if (!videoEl || !videoEl.videoWidth || videoEl.paused) return;

    hiddenCanvas.width = 480;
    hiddenCanvas.height = Math.round(480 * (videoEl.videoHeight / videoEl.videoWidth));
    hiddenCtx.drawImage(videoEl, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

    if (ws && ws.readyState === WebSocket.OPEN) {
      hiddenCanvas.toBlob((blob) => {
        if (blob && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(blob);
        }
      }, 'image/jpeg', 0.6);
      return;
    }

    if (!isSendingRest) {
      isSendingRest = true;
      try {
        const dataUrl = hiddenCanvas.toDataURL('image/jpeg', 0.5);
        const restEndpoint = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
          ? '/api/detect_currency'
          : 'https://audivue-backend-kray.onrender.com/api/detect_currency';

        const res = await fetch(restEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl })
        });
        if (res.ok) {
          const data = await res.json();
          handleDetectionData(data);
        }
      } catch (e) {
        console.warn('[AUDIVUE Currency REST] Notice:', e);
      } finally {
        isSendingRest = false;
      }
    }
  }, 90);
});
</script>
</body>
</html>
