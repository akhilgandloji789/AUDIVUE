<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Currency Mode (Pipeline 2)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "secondary-container": "#571bc1",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes wave {
        0%, 100% { height: 33%; }
        50% { height: 100%; }
    }
</style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden selection:bg-primary-container font-body-md antialiased">

<!-- Viewfinder Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center bg-[#0B1220] flex items-center justify-center">
    <video id="currencyWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
    <div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-transparent to-surface/90 pointer-events-none"></div>
</div>

<!-- Multi-Note Bounding Boxes AR Overlay -->
<div class="absolute inset-0 z-10 pointer-events-none">
    <!-- Box 1: ₹500 -->
    <div class="absolute top-1/3 left-1/4 w-[160px] h-[80px] border-4 border-[#A855F7] rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.6)] transform -rotate-6">
        <div class="absolute -top-[34px] left-0 bg-[#A855F7] text-white px-3 py-1 rounded-t-lg font-bold text-sm shadow-md">
            ₹500 — 98%
        </div>
    </div>
    <!-- Box 2: ₹200 -->
    <div class="absolute top-1/2 left-1/2 w-[150px] h-[75px] border-4 border-[#A855F7] rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.6)] transform rotate-3">
        <div class="absolute -top-[34px] left-0 bg-[#A855F7] text-white px-3 py-1 rounded-t-lg font-bold text-sm shadow-md">
            ₹200 — 95%
        </div>
    </div>
    <!-- Box 3: ₹100 -->
    <div class="absolute bottom-1/3 right-1/4 w-[140px] h-[70px] border-4 border-[#A855F7] rounded-xl shadow-[0_0_20px_rgba(168,85,247,0.6)] transform rotate-12">
        <div class="absolute -top-[34px] left-0 bg-[#A855F7] text-white px-3 py-1 rounded-t-lg font-bold text-sm shadow-md">
            ₹100 — 92%
        </div>
    </div>
</div>

<!-- Main UI Canvas -->
<main class="relative z-20 h-full w-full flex flex-col justify-between">
<!-- Top Section -->
<div class="flex flex-col gap-3">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container/90 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-extrabold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1.5 bg-emerald-400/20 border border-emerald-400/50 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
<span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span> LIVE
</div>
<div class="bg-[#A855F7]/20 border border-[#A855F7]/50 text-[#A855F7] px-3.5 py-1.5 rounded-full text-xs font-bold">
    Currency Mode
</div>
</div>
</header>
<div class="h-16"></div>

<!-- Supported Currency Denominations Strip -->
<div class="w-full overflow-x-auto px-6 py-2 no-scrollbar mt-2">
<div class="flex gap-3 min-w-max">
<div class="h-11 px-4 bg-surface-container/80 backdrop-blur-md rounded-xl border border-white/10 flex items-center justify-center text-on-surface-variant font-bold text-sm">₹10</div>
<div class="h-11 px-4 bg-surface-container/80 backdrop-blur-md rounded-xl border border-white/10 flex items-center justify-center text-on-surface-variant font-bold text-sm">₹20</div>
<div class="h-11 px-4 bg-surface-container/80 backdrop-blur-md rounded-xl border border-white/10 flex items-center justify-center text-on-surface-variant font-bold text-sm">₹50</div>
<div class="h-11 px-4 bg-[#A855F7]/30 backdrop-blur-md rounded-xl border border-[#A855F7] flex items-center justify-center text-white font-extrabold text-sm shadow">₹100</div>
<div class="h-11 px-4 bg-[#A855F7]/30 backdrop-blur-md rounded-xl border border-[#A855F7] flex items-center justify-center text-white font-extrabold text-sm shadow">₹200</div>
<div class="h-11 px-4 bg-[#A855F7]/30 backdrop-blur-md rounded-xl border border-[#A855F7] flex items-center justify-center text-white font-extrabold text-sm shadow">₹500</div>
<div class="h-11 px-4 bg-surface-container/80 backdrop-blur-md rounded-xl border border-white/10 flex items-center justify-center text-on-surface-variant font-bold text-sm">₹2000</div>
</div>
</div>
</div>

<!-- Bottom Section: Audio Total Feedback Card -->
<div class="flex flex-col w-full pb-[120px] px-6 gap-4">
<!-- Floating Action Button (Switch back to Environment Mode) -->
<div class="flex justify-end mb-2">
<button onclick="window.location.href='env_mode.html'" aria-label="Switch Mode" class="w-16 h-16 bg-[#A855F7] hover:bg-[#9333EA] text-white rounded-2xl flex items-center justify-center shadow-2xl border-2 border-[#A855F7]/50 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">sync_alt</span>
</button>
</div>

<!-- Audio Feedback Card -->
<div onclick="window.location.href='currency_results.html'" class="bg-surface-container/95 backdrop-blur-xl border border-[#A855F7]/50 rounded-2xl p-6 shadow-2xl relative overflow-hidden cursor-pointer hover:border-[#A855F7] transition-all">
<div class="absolute top-0 left-0 w-1.5 h-full bg-[#A855F7]"></div>
<div class="flex items-start gap-4">
<div class="w-12 h-12 bg-[#A855F7]/20 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#A855F7] text-3xl animate-pulse" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<div class="flex-1 flex flex-col gap-1">
<span class="text-xs text-[#A855F7] font-extrabold uppercase tracking-wider">Multi-Note Calculation</span>
<p id="currencyText" class="text-lg text-on-surface leading-snug font-extrabold">
    "500, 200 and 100 rupees detected. Total is 800 rupees."
</p>
</div>
</div>

<!-- Audio Equalizer Waveform -->
<div class="mt-4 flex gap-1.5 h-7 items-end opacity-90 px-10 justify-center">
<div class="w-1.5 bg-[#A855F7] rounded-full h-1/3 animate-[wave_1s_ease-in-out_infinite]"></div>
<div class="w-1.5 bg-[#A855F7] rounded-full h-2/3 animate-[wave_1.2s_ease-in-out_infinite_0.1s]"></div>
<div class="w-1.5 bg-[#A855F7] rounded-full h-full animate-[wave_0.9s_ease-in-out_infinite_0.2s]"></div>
<div class="w-1.5 bg-[#A855F7] rounded-full h-1/2 animate-[wave_1.1s_ease-in-out_infinite_0.3s]"></div>
<div class="w-1.5 bg-[#A855F7] rounded-full h-3/4 animate-[wave_1.3s_ease-in-out_infinite_0.4s]"></div>
<div class="w-1.5 bg-[#A855F7] rounded-full h-1/3 animate-[wave_1s_ease-in-out_infinite_0.5s]"></div>
</div>
</div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">visibility</span>
<span class="text-xs font-semibold">Vision</span>
</button>
<button onclick="window.location.href='currency_results.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">receipt_long</span>
<span class="text-xs font-semibold">Results</span>
</button>
<!-- Active Tab: Currency -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="text-xs font-bold">Currency</span>
</button>
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-xs font-semibold">Settings</span>
</button>
</nav>
</main>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('currencyWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Currency webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakCurrencyAlert([500, 200, 100], 800);
        }, 600);
    });
</script>
</body>
</html>
