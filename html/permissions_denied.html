<style>
        body {
            background-color: #0B1220;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }
        
        .glass-card {
            background: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .focus-outline:focus {
            outline: 3px solid #3B82F6;
            outline-offset: 2px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="text-on-background flex flex-col min-h-screen relative overflow-x-hidden">
<!-- Ambient Background Glows -->
<div class="absolute top-0 left-1/4 w-96 h-96 bg-brand-blue rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none z-0"></div>
<div class="absolute bottom-0 right-1/4 w-96 h-96 bg-error-container rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none z-0"></div>

<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-touch-target-min bg-surface dark:bg-surface sticky top-0 z-40">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-[28px]">visibility</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight m-0">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-error flex items-center justify-center relative">
<div class="w-2 h-2 rounded-full bg-error"></div>
</div>
<span class="font-label-md text-label-md text-error">DENIED</span>
<span class="material-symbols-outlined text-error text-[28px] ml-2">sensors_off</span>
</div>
</header>

<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile py-8 z-10 relative pb-[140px]">
<div class="glass-card rounded-2xl w-full max-w-lg p-8 sm:p-10 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Subtle top border accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-error to-transparent opacity-75"></div>

<!-- Icon Group -->
<div class="flex items-center justify-center mb-8 mt-4">
<div class="w-24 h-24 rounded-full bg-error-container/20 flex items-center justify-center relative group">
<div class="absolute inset-0 rounded-full bg-error-container/10 blur-md animate-pulse"></div>
<span class="material-symbols-outlined text-error text-[48px] relative z-10" style="font-variation-settings: 'FILL' 1;">videocam_off</span>
</div>
</div>

<!-- Text Content -->
<h2 class="font-headline-md text-headline-md text-on-background mb-4">Camera access is needed</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-sm mx-auto">
    AUDIVUE cannot function without camera and microphone access. Please enable them in your browser or device settings to continue.
</p>

<!-- Actions -->
<button id="btnTryAgain" class="w-full min-h-touch-target-min bg-brand-blue hover:bg-inverse-primary text-white font-label-lg text-label-lg rounded-xl transition-colors duration-200 focus-outline flex items-center justify-center gap-3 active:scale-[0.98]">
    Try Again
</button>

<button onclick="alert('To enable permissions:\n1. Click the lock/settings icon next to the URL bar.\n2. Allow Camera & Microphone.\n3. Refresh the page.')" class="mt-6 w-full min-h-touch-target-min text-primary hover:text-brand-blue font-label-md text-label-md transition-colors duration-200 focus-outline underline decoration-2 underline-offset-4">
    How to enable permissions
</button>
</div>
</main>

<!-- BottomNavBar -->
<nav aria-label="Main Navigation" class="fixed bottom-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 min-h-[100px] bg-surface-container-low dark:bg-surface-container-low backdrop-blur-md shadow-md rounded-t-xl">
<button onclick="window.location.href='permissions.html'" class="flex flex-col items-center justify-center bg-error-container text-on-error-container rounded-xl p-2 border-2 border-error scale-95 transition-all duration-300 w-24 h-20 focus-outline">
<span class="material-symbols-outlined text-[32px] mb-1">warning</span>
<span class="font-label-md text-label-md text-sm">Denied</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-highest rounded-xl scale-95 transition-all duration-300 w-24 h-20 focus-outline">
<span class="material-symbols-outlined text-[32px] mb-1">visibility</span>
<span class="font-label-md text-label-md text-sm">Vision</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-highest rounded-xl scale-95 transition-all duration-300 w-24 h-20 focus-outline">
<span class="material-symbols-outlined text-[32px] mb-1">payments</span>
<span class="font-label-md text-label-md text-sm">Currency</span>
</button>
</nav>

<script>
    document.getElementById('btnTryAgain').addEventListener('click', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                window.location.href = 'env_mode.html';
                return;
            }
        } catch (e) {
            console.log('Permission denied again:', e);
        }
        window.location.href = 'permissions.html';
    });
</script>
</body>
</html>
