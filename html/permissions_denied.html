<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Permission Denied</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .glass-card {
            background: rgba(18, 20, 20, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col justify-between relative overflow-hidden">

<!-- TopAppBar -->
<header class="w-full z-50 flex justify-between items-center px-6 h-16 border-b border-white/10 bg-background/80 backdrop-blur-md sticky top-0">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-bold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2 bg-error-container/40 px-3 py-1.5 rounded-full border border-error/40">
<span class="w-2.5 h-2.5 bg-error rounded-full animate-ping"></span>
<span class="text-xs font-bold text-error tracking-wider uppercase">DENIED</span>
</div>
</header>

<!-- Main Permission Denied Card -->
<main class="flex-grow z-10 flex flex-col justify-center items-center px-6 py-12 relative">
<div class="glass-card rounded-3xl p-8 md:p-10 max-w-lg w-full flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Top Red Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-error to-transparent"></div>

<!-- Icon Group -->
<div class="w-20 h-20 rounded-full bg-error-container/30 flex items-center justify-center border border-error/40 mb-6 shadow-[0_0_30px_rgba(255,180,171,0.2)]">
<span class="material-symbols-outlined text-error text-4xl" style="font-variation-settings: 'FILL' 1;">videocam_off</span>
</div>

<h2 class="text-3xl font-extrabold text-on-surface mb-3">Camera Access Needed</h2>
<p class="text-on-surface-variant text-base mb-8 leading-relaxed">
    AUDIVUE cannot analyze obstacles or count currency without camera and microphone permissions. Please grant access to continue.
</p>

<!-- Action Buttons -->
<button id="btnTryAgain" class="w-full py-4 bg-primary-container hover:bg-primary-fixed text-on-primary-container font-bold rounded-2xl transition-all shadow-xl flex items-center justify-center gap-3 active:scale-95 border border-primary/40 text-lg mb-4">
    <span class="material-symbols-outlined text-2xl">refresh</span>
    <span>Try Again</span>
</button>

<button onclick="alert('To enable permissions:\n1. Click the lock/settings icon next to the URL bar.\n2. Allow Camera & Microphone.\n3. Refresh the page.')" class="w-full py-3 border border-white/10 text-primary hover:text-primary-fixed font-semibold rounded-xl transition-all text-sm">
    How to enable permissions
</button>
</div>
</main>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Camera access is needed for AUDIVUE. Tap try again to grant permission.", "high");
        }, 500);

        document.getElementById('btnTryAgain').addEventListener('click', async () => {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    window.location.href = 'env_mode.html';
                    return;
                }
            } catch (e) {
                console.log('Permission denied again:', e);
            }
            window.location.href = 'permissions.html';
        });
    });
</script>
</body>
</html>
