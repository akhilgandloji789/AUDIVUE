<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Smart Mode Suggestion</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#0B1220;height:100dvh;overflow:hidden;font-family:Inter,sans-serif;}
  @keyframes slideUpAnim{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slide-up{animation:slideUpAnim 0.45s cubic-bezier(0.16,1,0.3,1) both;}
  .btn-switch{width:100%;height:56px;background:#4d8eff;color:#001a42;font-weight:700;font-size:16px;font-family:Inter,sans-serif;border:none;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;box-shadow:0 4px 20px rgba(77,142,255,0.3);margin-bottom:12px;}
  .btn-switch:hover{background:#5a97ff;}.btn-switch:active{transform:scale(0.97);}
  .btn-stay{width:100%;height:48px;background:transparent;color:#c2c6d6;font-weight:600;font-size:14px;font-family:Inter,sans-serif;border:1px solid rgba(255,255,255,0.15);border-radius:12px;cursor:pointer;transition:all 0.15s;}
  .top-bar-fix{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:60px;background:rgba(11,18,32,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo-link .material-symbols-outlined{font-size:26px;color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(12,15,15,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.07);padding:0 8px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#e2e2e2;}
  .nav-btn.active{background:#adc6ff;color:#001a42;font-weight:700;}
  .nav-btn .material-symbols-outlined{font-size:22px;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.45}}
</style>
</head>
<body>
<div style="position:fixed;inset:0;z-index:0;background:rgba(11,18,32,0.7);backdrop-filter:blur(8px);"></div>
<header class="top-bar-fix">
  <a class="logo-link" href="index.html"><span class="material-symbols-outlined">visibility</span><h1>AUDIVUE</h1></a>
  <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);color:#34d399;"><span style="width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block;animation:pulse 2s infinite;"></span>AUTO DETECT</div>
</header>
<main style="position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 84px;">
  <div class="glass slide-up" style="border-radius:24px;padding:28px 24px;max-width:440px;width:100%;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#4d8eff,#a855f7);"></div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;">
      <div style="width:60px;height:60px;border-radius:50%;background:rgba(168,85,247,0.12);border:2px solid rgba(168,85,247,0.35);display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined" style="font-size:32px;color:#a855f7;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">payments</span></div>
      <div><h2 style="font-size:21px;font-weight:800;color:#e2e2e2;margin:0 0 6px;">Currency Detected</h2><p style="font-size:14px;color:#8c909f;margin:0;">Switch to Currency Detection Mode?</p></div>
      <button onclick="window.location.href='mode_transition.html'" class="btn-switch"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">payments</span>Switch to Currency Mode</button>
      <button onclick="window.location.href='env_mode.html'" class="btn-stay">Stay in Environment Mode</button>
    </div>
  </div>
  <div style="margin-top:12px;max-width:440px;width:100%;background:rgba(14,18,30,0.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;">
    <span class="material-symbols-outlined" style="color:#4d8eff;font-size:22px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;animation:pulse 2s infinite;">volume_up</span>
    <p style="font-size:13px;color:#c2c6d6;margin:0;font-weight:600;">"Currency detected. Switch to Currency Mode?"</p>
  </div>
</main>
<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'"><span class="material-symbols-outlined">visibility</span>Vision</button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'"><span class="material-symbols-outlined">crisis_alert</span>Alerts</button>
  <button class="nav-btn active"><span class="material-symbols-outlined">settings_suggest</span>Auto</button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'"><span class="material-symbols-outlined">graphic_eq</span>Audio</button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'"><span class="material-symbols-outlined">settings</span>Settings</button>
</nav>
<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof AudivueVoiceAssistant!=='undefined'){
    const va=new AudivueVoiceAssistant({rate:1.05,pitch:1.0});
    setTimeout(()=>va.speak('Currency detected. Switch to Currency Mode?','high'),500);
  }
});
</script>
</body>
</html>
