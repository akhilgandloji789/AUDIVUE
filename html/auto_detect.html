<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Smart Mode Suggestion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "secondary-container": "#571bc1",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up-card { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative">

<!-- Background Layer: Dimmed Live Camera Feed -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="autoDetectWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
    <div class="absolute inset-0 bg-background/80 backdrop-blur-sm"></div>
</div>

<!-- TopAppBar -->
<header class="fixed top-0 flex justify-between items-center px-6 h-16 w-full z-50 bg-background/90 backdrop-blur-md border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-black text-2xl tracking-tight text-primary m-0">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider bg-emerald-400/20 px-3 py-1.5 rounded-full border border-emerald-400/40">● AUTO DETECT</span>
</div>
</header>

<!-- Main Content Area -->
<main class="absolute inset-0 z-10 flex flex-col justify-end pb-32">
<!-- Smart Mode Suggestion Modal Card -->
<div class="mx-6 mb-6 glass-card rounded-3xl p-8 border border-white/10 shadow-2xl slide-up-card relative overflow-hidden max-w-lg mx-auto w-full">
<!-- Top Glow Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary via-primary to-secondary"></div>
<div class="flex flex-col items-center text-center space-y-4">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-secondary-container/30 flex items-center justify-center border border-secondary-container/50 shadow-lg">
<span class="material-symbols-outlined text-secondary text-4xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>

<!-- Text Content -->
<div class="space-y-1">
<h2 class="text-2xl font-extrabold text-on-surface">Currency Detected</h2>
<p class="text-base text-on-surface-variant">Switch to Currency Detection Mode?</p>
</div>

<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3 mt-4">
<button onclick="window.location.href='mode_transition.html'" class="py-4 w-full bg-primary-container text-on-primary-container font-extrabold rounded-2xl flex justify-center items-center hover:brightness-110 active:scale-95 transition-all shadow-xl text-lg border border-primary/40">
    Switch Now
</button>
<button onclick="window.location.href='env_mode.html'" class="py-3.5 w-full bg-transparent text-on-surface border border-white/20 font-bold rounded-xl flex justify-center items-center hover:bg-white/5 active:scale-95 transition-all text-sm">
    Stay in Environment Mode
</button>
</div>
</div>
</div>

<!-- Audio Status Caption Area -->
<div class="mx-6 mb-8 bg-surface-container/90 backdrop-blur-md rounded-2xl p-4 flex items-center gap-4 border border-outline/20 max-w-lg mx-auto w-full shadow-lg">
<span class="material-symbols-outlined text-primary animate-pulse" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<p class="text-sm text-on-surface-variant m-0 font-bold">Currency detected. Switch to Currency Mode?</p>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">mic</span>
<span class="text-xs font-semibold">Ready</span>
</button>
<!-- Active Auto Detect -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">settings_suggest</span>
<span class="text-xs font-bold">Auto Detect</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">payments</span>
<span class="text-xs font-semibold">Currency</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('autoDetectWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak('Currency detected. Switch to Currency Mode?', 'high');
        }, 500);
    });
</script>
</body>
</html>
