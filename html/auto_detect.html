<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Smart Mode Suggestion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#adc6ff",
                        "tertiary": "#c0c6da",
                        "inverse-on-surface": "#2f3131",
                        "error-container": "#93000a",
                        "background": "#121414",
                        "surface-bright": "#37393a",
                        "on-error": "#690005",
                        "surface": "#121414",
                        "tertiary-fixed": "#dce2f6",
                        "on-primary-container": "#00285d",
                        "secondary-fixed-dim": "#d0bcff",
                        "on-tertiary-container": "#232a39",
                        "on-primary-fixed-variant": "#004395",
                        "secondary-fixed": "#e9ddff",
                        "on-primary-fixed": "#001a42",
                        "tertiary-container": "#8a90a3",
                        "primary-fixed": "#d8e2ff",
                        "on-surface": "#e2e2e2",
                        "on-secondary-container": "#c4abff",
                        "primary-container": "#4d8eff",
                        "surface-tint": "#adc6ff",
                        "surface-container-lowest": "#0c0f0f",
                        "secondary-container": "#571bc1",
                        "on-tertiary": "#2a3040",
                        "surface-dim": "#121414",
                        "error": "#ffb4ab",
                        "outline": "#8c909f",
                        "surface-container-high": "#282a2b",
                        "tertiary-fixed-dim": "#c0c6da",
                        "surface-variant": "#333535",
                        "primary": "#adc6ff",
                        "secondary": "#d0bcff",
                        "on-tertiary-fixed": "#151b2a",
                        "on-secondary": "#3c0091",
                        "inverse-surface": "#e2e2e2",
                        "on-primary": "#002e6a",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#333535",
                        "surface-container": "#1e2020",
                        "on-background": "#e2e2e2",
                        "on-secondary-fixed": "#23005c",
                        "outline-variant": "#424754",
                        "on-surface-variant": "#c2c6d6",
                        "inverse-primary": "#005ac2",
                        "on-tertiary-fixed-variant": "#404757",
                        "surface-container-low": "#1a1c1c",
                        "on-secondary-fixed-variant": "#5516be"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "stack-gap": "16px",
                        "touch-target-min": "64px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {

                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "400" }]
                    },
                    "animation": {
                        "slide-up": "slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        "pulse-slow": "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite"
                    },
                    "keyframes": {
                        "slideUp": {
                            "0%": { transform: "translateY(100%)", opacity: "0" },
                            "100%": { transform: "translateY(0)", opacity: "1" }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
</style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative">

<!-- Background Layer: Dimmed Live Camera Feed -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="autoDetectWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
    <div class="absolute inset-0 bg-background/80 backdrop-blur-sm"></div>

    <!-- Simulated Environment Detections -->
    <div class="absolute top-1/4 left-1/4 w-32 h-48 border-2 border-primary-container rounded-lg opacity-40 animate-pulse-slow"></div>
    <div class="absolute bottom-1/3 right-1/4 w-24 h-24 border-2 border-primary-container rounded-lg opacity-30"></div>
</div>

<!-- TopAppBar -->
<header class="fixed top-0 flex justify-between items-center px-margin-mobile h-[touch-target-min] w-full z-50 bg-background backdrop-blur-md border-b-2 border-white/10">
<div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-headline-lg text-headline-lg font-black tracking-tight text-primary m-0">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-label-lg text-label-lg text-emerald-400 uppercase tracking-wider font-bold">● AUTO DETECT</span>
</div>
</header>

<!-- Main Content Area -->
<main class="absolute inset-0 z-10 flex flex-col justify-end pb-32">
<!-- Smart Mode Suggestion Modal Card -->
<div class="mx-margin-mobile mb-gutter bg-surface-container/95 backdrop-blur-xl rounded-2xl p-gutter border border-white/10 shadow-2xl animate-slide-up relative overflow-hidden max-w-lg mx-auto w-full">
<!-- Subtle accent glow -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary-container to-transparent opacity-75"></div>
<div class="flex flex-col items-center text-center space-y-stack-gap">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-secondary-container/30 flex items-center justify-center border border-secondary-container/50 shadow-lg">
<span aria-hidden="true" class="material-symbols-outlined text-secondary-fixed-dim text-4xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>

<!-- Text Content -->
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Currency detected</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Switch to Currency Mode?</p>
</div>

<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3 mt-4">
<button onclick="window.location.href='currency_mode.html'" class="h-[touch-target-min] w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold rounded-xl flex justify-center items-center hover:brightness-110 active:scale-95 transition-all shadow-lg">
    Switch
</button>
<button onclick="window.location.href='env_mode.html'" class="h-[touch-target-min] w-full bg-transparent text-primary-fixed border-2 border-primary-fixed/50 font-label-lg text-label-lg font-semibold rounded-xl flex justify-center items-center hover:bg-primary-fixed/10 active:scale-95 transition-all">
    Stay in Environment Mode
</button>
</div>
</div>
</div>

<!-- Audio Status Caption Area -->
<div class="mx-margin-mobile mb-8 bg-surface-container-highest/90 backdrop-blur-md rounded-xl p-4 flex items-center gap-4 border border-outline/20 max-w-lg mx-auto w-full shadow-lg">
<span aria-hidden="true" class="material-symbols-outlined text-primary-fixed animate-pulse" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<p class="font-body-md text-body-md text-on-surface-variant m-0 font-semibold">Currency detected. Switch to Currency Mode?</p>
</div>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 bg-surface-container backdrop-blur-xl shadow-lg rounded-t-xl border-t-2 border-white/10">
<!-- Tab 1: Ready (Inactive) -->
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl flex-1">
<span aria-hidden="true" class="material-symbols-outlined text-3xl mb-1">mic</span>
<span class="font-label-md text-label-md">Ready</span>
</button>
<!-- Tab 2: Processing (Active) -->
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl h-[touch-target-min] px-6 border-2 border-primary scale-98 transition-transform duration-100 flex-1">
<span aria-hidden="true" class="material-symbols-outlined text-3xl mb-1" style="font-variation-settings: 'FILL' 1;">settings_suggest</span>
<span class="font-label-md text-label-md font-bold">Auto Detect</span>
</button>
<!-- Tab 3: Speaking (Inactive) -->
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl flex-1">
<span aria-hidden="true" class="material-symbols-outlined text-3xl mb-1">payments</span>
<span class="font-label-md text-label-md">Currency</span>
</button>
</nav>

<!-- Load Voice Assistant for Smart Suggestion Voice Prompt -->
<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('autoDetectWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak('Currency detected. Switch to Currency Mode?', 'high');
        }, 500);
    });
</script>
</body>
</html>
