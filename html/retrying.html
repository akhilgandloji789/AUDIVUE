<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Processing Error Retry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        .spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .pulse-amber { animation: pulse-amber 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-amber { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">

<!-- Live Camera Feed Background (Simulated) -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="retryWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-30 blur-sm scale-105"></video>
    <div class="absolute inset-0 z-0 bg-gradient-to-b from-background/80 via-background/40 to-background/90"></div>
</div>

<!-- TopAppBar -->
<header class="relative z-10 top-0 bg-surface-container/90 backdrop-blur-md text-primary flex justify-between items-center w-full px-6 h-16 border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<button aria-label="Menu" class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-white/5 text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
<span class="font-extrabold text-2xl text-primary tracking-tight">AUDIVUE</span>
</div>
<div class="bg-amber-900/30 border border-amber-500/50 rounded-full px-4 py-1.5 flex items-center gap-2 backdrop-blur-sm shadow">
<span class="material-symbols-outlined text-amber-500 text-sm">warning</span>
<span class="text-xs text-amber-400 font-extrabold tracking-wider uppercase">SYSTEM ERROR</span>
</div>
</header>

<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-6 pb-24">
<!-- Error Overlay Card -->
<div class="w-full max-w-sm glass-card rounded-3xl p-8 flex flex-col items-center text-center shadow-2xl relative overflow-hidden border border-white/10">
<div class="h-20 w-20 rounded-full bg-amber-900/40 border-2 border-amber-500/50 flex items-center justify-center mb-6 relative">
<span class="material-symbols-outlined text-4xl text-amber-500 pulse-amber">report_problem</span>
<!-- Circular Retry Timer Animation -->
<svg class="absolute inset-0 w-full h-full spin-slow" viewbox="0 0 100 100">
<circle class="text-amber-500/20" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-amber-500" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="75 300" stroke-linecap="round" stroke-width="4"></circle>
</svg>
</div>

<h2 class="text-2xl font-extrabold text-on-surface mb-3">AI Processing Unavailable</h2>
<p class="text-base text-on-surface-variant mb-8">
    AUDIVUE can't analyze your surroundings right now. Retrying automatically...
</p>

<button onclick="window.location.href='env_mode.html'" class="w-full py-4 bg-primary-container text-on-primary-container font-extrabold text-lg rounded-2xl flex items-center justify-center gap-3 transition-all hover:bg-primary-fixed shadow-xl active:scale-95 border border-primary/40">
<span class="material-symbols-outlined text-2xl">refresh</span>
<span>Retry Now</span>
</button>
</div>
</main>

<!-- Audio Status Indicator -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface-container/95 backdrop-blur-xl border-t border-white/10 py-4 px-6 flex flex-col items-center shadow-2xl">
<div class="flex items-center gap-3 mb-1">
<div class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div>
<span class="text-sm text-on-surface font-extrabold">🔊 Speaking Error Telemetry...</span>
</div>
<p class="text-sm text-on-surface-variant/90 text-center max-w-[90%] font-semibold">
    "AI processing unavailable, please wait. Retrying automatically."
</p>
</div>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('retryWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("AI processing unavailable, please wait. Retrying automatically.", "high");
        }, 500);

        // Auto retry transition after 5s
        setTimeout(() => {
            window.location.href = 'env_mode.html';
        }, 5000);
    });
</script>
</body>
</html>
