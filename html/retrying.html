<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Retrying Connection</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#0B1220;min-height:100dvh;display:flex;flex-direction:column;font-family:Inter,sans-serif;}
  @keyframes slideUpAnim{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes spinAnim{to{transform:rotate(360deg)}}
  @keyframes dashAnim{0%{stroke-dasharray:1,150;stroke-dashoffset:0}50%{stroke-dasharray:90,150;stroke-dashoffset:-35}100%{stroke-dasharray:90,150;stroke-dashoffset:-124}}
  @keyframes fillBar{from{width:0}to{width:100%}}
  .slide-up{animation:slideUpAnim 0.45s cubic-bezier(0.16,1,0.3,1) both;}
  .spin-svg{animation:spinAnim 1.4s linear infinite;transform-origin:center;}
  .dash-ring{animation:dashAnim 1.5s ease-in-out infinite;}
  .timer-fill{animation:fillBar 5s linear forwards;}
  .top-bar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .btn-p{width:100%;height:56px;background:#4d8eff;color:#001a42;font-weight:700;font-size:16px;font-family:Inter,sans-serif;border:none;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;box-shadow:0 4px 20px rgba(77,142,255,0.3);}
  .btn-p:hover{background:#5a97ff;}.btn-p:active{transform:scale(0.97);}
  .btn-s{width:100%;height:48px;background:transparent;color:#c2c6d6;font-weight:600;font-size:14px;font-family:Inter,sans-serif;border:1px solid rgba(255,255,255,0.15);border-radius:12px;cursor:pointer;transition:all 0.15s;margin-top:10px;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
</style>
</head>
<body>
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35);color:#f59e0b;font-family:Inter,sans-serif;">
    <span style="width:7px;height:7px;border-radius:50%;background:#f59e0b;display:inline-block;animation:pAnim 1s ease-in-out infinite;"></span>RETRYING
  </div>
</header>

<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 96px;">
  <div class="glass slide-up" style="border-radius:24px;padding:36px 24px;max-width:420px;width:100%;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#f59e0b,transparent);"></div>

    <!-- Spinning Ring Loader -->
    <div style="position:relative;width:76px;height:76px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;">
      <svg class="spin-svg" width="76" height="76" viewBox="0 0 76 76" fill="none" style="position:absolute;inset:0;">
        <circle cx="38" cy="38" r="32" stroke="rgba(245,158,11,0.15)" stroke-width="5"/>
        <circle cx="38" cy="38" r="32" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" class="dash-ring"/>
      </svg>
      <span style="position:relative;font-size:30px;color:#f59e0b;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">warning</span>
    </div>

    <h2 style="font-size:22px;font-weight:800;color:#e2e2e2;margin:0 0 8px;">Reconnecting to AI...</h2>
    <p style="font-size:14px;color:#8c909f;line-height:1.6;margin:0 0 24px;">Attempting to restore AI vision processing. Returning to Vision Mode in <strong id="countdownSec" style="color:#f59e0b;">5</strong> seconds.</p>

    <!-- Auto-progress bar -->
    <div style="height:6px;border-radius:6px;background:rgba(245,158,11,0.12);overflow:hidden;margin-bottom:20px;">
      <div class="timer-fill" style="height:100%;background:#f59e0b;border-radius:6px;"></div>
    </div>

    <!-- Attempt Counter -->
    <div style="font-size:12px;color:#424754;margin-bottom:20px;" id="attemptText">Attempt 1 of 3 · Checking AI endpoint...</div>

    <button onclick="clearInterval(window._retryTimer);window.location.href='env_mode.html'" class="btn-p">
      <span style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;font-size:22px;">play_arrow</span>
      Resume Now
    </button>
    <button onclick="window.location.href='ai_unavailable.html'" class="btn-s">View Error Details</button>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'">
    <span class="ms material-symbols-outlined">crisis_alert</span>Alerts
  </button>
  <button class="nav-btn" onclick="window.location.href='currency_mode.html'">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<style>@keyframes pAnim{0%,100%{opacity:1}50%{opacity:0.3}}</style>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
let remaining = 5;
const cd = document.getElementById('countdownSec');
const attempts = ['Attempt 1 of 3 · Checking AI endpoint...', 'Attempt 2 of 3 · Testing vision pipeline...', 'Attempt 3 of 3 · Verifying model response...'];
let attempt = 0;
const attemptEl = document.getElementById('attemptText');

window._retryTimer = setInterval(() => {
  remaining--;
  if (cd) cd.textContent = remaining;
  if (remaining <= 3 && attempt < 2) { attempt++; if(attemptEl) attemptEl.textContent = attempts[attempt]; }
  if (remaining <= 0) {
    clearInterval(window._retryTimer);
    window.location.href = 'env_mode.html';
  }
}, 1000);

document.addEventListener('DOMContentLoaded', () => {
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    const va = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
    setTimeout(() => va.speak('Reconnecting to AI. Returning to Vision Mode in 5 seconds.', 'high'), 400);
  }
});
</script>
</body>
</html>
