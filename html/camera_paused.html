    body {
      min-height: max(884px, 100dvh);
      background-color: #0B1220;
    }

    }

<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen flex flex-col overflow-hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface-container-low backdrop-blur-xl border-b border-outline-variant transition-all duration-200">
<div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary font-bold text-[32px]" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">AUDIVUE</span>
</div>
<div class="flex items-center">
<div class="flex items-center gap-1.5 bg-surface-variant text-on-surface px-4 py-2 rounded-full font-label-md text-label-md border border-outline-variant/50 shadow">
<span class="material-symbols-outlined text-[20px]">pause</span>
<span>PAUSED</span>
</div>
</div>
</header>

<!-- Main Content: Paused Camera Canvas -->
<main class="flex-1 relative mt-[64px] mb-[164px] bg-surface-container-lowest flex items-center justify-center overflow-hidden">
<!-- Large Background Icon -->
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[240px] text-on-surface">videocam_off</span>
</div>

<!-- Foreground Card -->
<div class="relative z-10 bg-surface-container-high/90 backdrop-blur-2xl rounded-2xl p-8 max-w-[90%] w-[400px] flex flex-col items-center text-center border border-outline-variant shadow-2xl">
<div class="w-20 h-20 bg-surface-variant/80 rounded-full flex items-center justify-center mb-6 shadow-inner border border-white/10">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant">videocam_off</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 font-bold">Camera paused</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8">Tap resume to continue processing visual information.</p>

<button onclick="window.location.href='env_mode.html'" class="w-full h-touch-target-min bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold rounded-xl flex items-center justify-center gap-3 hover:bg-primary hover:text-on-primary transition-all focus:outline-none focus:ring-4 focus:ring-primary/50 active:scale-95 duration-200 shadow-xl">
<span class="material-symbols-outlined text-[28px]">replay</span>
<span>Resume Camera</span>
</button>
</div>
</main>

<!-- Audio Status Bar (Persistent) -->
<div class="fixed bottom-[100px] left-0 w-full h-[64px] bg-surface-container z-40 border-t border-outline-variant/30 flex items-center justify-between px-margin-mobile shadow-lg">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">volume_up</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Camera Paused — Ready</span>
</div>
<div class="flex-1 max-w-[120px] ml-4">
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full w-full bg-outline rounded-full opacity-50"></div>
</div>
</div>
</div>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-[100px] pb-safe bg-surface dark:bg-surface-container-lowest border-t-2 border-outline-variant rounded-t-xl shadow-lg">
<!-- Active Tab: Vision -->
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-4 border-2 border-primary min-w-[80px] h-[80px] scale-98 transition-transform shadow-lg">
<span class="material-symbols-outlined text-[28px] mb-1" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-label-md text-label-md text-[14px] font-bold">Vision</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright rounded-xl min-w-[80px] h-[80px] transition-colors">
<span class="material-symbols-outlined text-[28px] mb-1">explore</span>
<span class="font-label-md text-label-md text-[14px]">Explore</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright rounded-xl min-w-[80px] h-[80px] transition-colors">
<span class="material-symbols-outlined text-[28px] mb-1">payments</span>
<span class="font-label-md text-label-md text-[14px]">Currency</span>
</button>
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright rounded-xl min-w-[80px] h-[80px] transition-colors">
<span class="material-symbols-outlined text-[28px] mb-1">settings</span>
<span class="font-label-md text-label-md text-[14px]">Settings</span>
</button>
</nav>

<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Camera paused. Tap resume to continue.", "high");
        }, 500);
    });
</script>
</body>
</html>
