<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Authenticated</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  @keyframes scaleIn{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes checkDraw{to{stroke-dashoffset:0}}
  @keyframes slideUpAnim{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .check-circle{animation:scaleIn 0.5s cubic-bezier(0.16,1,0.3,1) both;}
  .check-path{stroke-dasharray:60;stroke-dashoffset:60;animation:checkDraw 0.6s 0.4s ease forwards;}
  .slide-up{animation:slideUpAnim 0.45s cubic-bezier(0.16,1,0.3,1) both;}
  .top-bar-fix{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-link .material-symbols-outlined{font-size:28px;color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:22px;font-weight:900;color:#adc6ff;letter-spacing:-0.02em;margin:0;}
  .btn-p{width:100%;height:56px;background:#4d8eff;color:#001a42;font-weight:700;font-size:16px;font-family:Inter,sans-serif;border:none;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;box-shadow:0 4px 20px rgba(77,142,255,0.3);}
  .btn-p:hover{background:#5a97ff;}
  .btn-p:active{transform:scale(0.97);}
</style>
</head>
<body style="background:#0B1220;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,sans-serif;">
<header class="top-bar-fix">
  <a class="logo-link" href="index.html"><span class="material-symbols-outlined">visibility</span><h1>AUDIVUE</h1></a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);color:#34d399;"><span style="width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block;animation:pulse 2s infinite;"></span>AUTHENTICATED</div>
</header>
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="glass slide-up" style="border-radius:24px;padding:40px 28px;max-width:400px;width:100%;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#34d399,#4d8eff,#a855f7);"></div>
    <div class="check-circle" style="width:80px;height:80px;margin:0 auto 24px;">
      <svg viewBox="0 0 80 80" fill="none" width="80" height="80">
        <circle cx="40" cy="40" r="36" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="3"/>
        <path class="check-path" d="M24 40 L35 51 L56 29" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 style="font-size:24px;font-weight:800;color:#e2e2e2;margin:0 0 8px;">Welcome Back!</h2>
    <p style="font-size:14px;color:#8c909f;margin:0 0 28px;line-height:1.5;">Authentication successful. Setting up your vision workspace...</p>
    <button onclick="window.location.href='permissions.html'" class="btn-p">
      <span class="material-symbols-outlined">arrow_forward</span>Continue to Permissions
    </button>
  </div>
</main>
<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof AudivueVoiceAssistant!=='undefined'){
    const va=new AudivueVoiceAssistant({rate:1.05,pitch:1.0});
    setTimeout(()=>va.speak('Authentication successful. Welcome to AUDIVUE.','high'),300);
  }
  setTimeout(()=>window.location.href='permissions.html',2000);
});
</script>
</body>
</html>
