<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Authentication Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .glass-card {
            background: rgba(18, 20, 20, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col justify-between relative overflow-hidden">

<!-- TopAppBar -->
<header class="w-full z-50 flex justify-between items-center px-6 h-16 border-b border-white/10 bg-background/80 backdrop-blur-md sticky top-0">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-bold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container px-3 py-1.5 rounded-full border border-emerald-400/30">
<span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
<span class="text-xs font-bold text-emerald-400 tracking-wider uppercase">AUTHENTICATED</span>
</div>
</header>

<!-- Main Auth Success Content -->
<main class="flex-grow z-10 flex flex-col justify-center items-center px-6 py-12 relative">
<div class="glass-card rounded-3xl p-10 max-w-md w-full flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Top Glow Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 via-primary to-secondary"></div>

<!-- Animated Success Check SVG -->
<div class="w-32 h-32 mb-6 flex items-center justify-center">
    <img src="../assets/success_check.svg" alt="Authentication Success Check" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='../assets/logo.png'"/>
</div>

<h2 class="text-3xl font-extrabold text-on-surface mb-2">Welcome Back!</h2>
<p class="text-on-surface-variant text-base mb-8">Authentication successful. Setting up your vision workspace...</p>

<!-- Continue Action Button -->
<button onclick="window.location.href='permissions.html'" class="w-full py-4 bg-primary-container hover:bg-primary-fixed text-on-primary-container font-bold rounded-2xl transition-all shadow-xl flex items-center justify-center gap-3 active:scale-95 border border-primary/40 text-lg">
    <span>Continue to Permissions</span>
    <span class="material-symbols-outlined text-2xl">arrow_forward</span>
</button>
</div>
</main>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Authentication successful. Welcome to AUDIVUE.", "high");
        }, 300);

        // Auto transition to permissions.html after 1.8s
        setTimeout(() => {
            window.location.href = 'permissions.html';
        }, 1800);
    });
</script>
</body>
</html>
