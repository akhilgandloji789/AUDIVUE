<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Audio Status Monitor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e9ddff",
                        "tertiary-fixed": "#dce2f6",
                        "surface-tint": "#adc6ff",
                        "on-secondary-fixed-variant": "#5516be",
                        "on-error": "#690005",
                        "primary": "#adc6ff",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-lowest": "#0c0f0f",
                        "on-secondary-container": "#c4abff",
                        "inverse-primary": "#005ac2",
                        "secondary-fixed-dim": "#d0bcff",
                        "primary-container": "#4d8eff",
                        "background": "#121414",
                        "surface-dim": "#121414",
                        "on-tertiary-container": "#232a39",
                        "on-background": "#e2e2e2",
                        "surface": "#121414",
                        "surface-bright": "#37393a",
                        "on-tertiary-fixed": "#151b2a",
                        "on-primary-fixed-variant": "#004395",
                        "surface-container-low": "#1a1c1c",
                        "primary-fixed": "#d8e2ff",
                        "on-primary": "#002e6a",
                        "on-secondary-fixed": "#23005c",
                        "on-primary-container": "#00285d",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#333535",
                        "error-container": "#93000a",
                        "inverse-surface": "#e2e2e2",
                        "tertiary-container": "#8a90a3",
                        "on-secondary": "#3c0091",
                        "surface-variant": "#333535",
                        "on-surface": "#e2e2e2",
                        "tertiary": "#c0c6da",
                        "surface-container": "#1e2020",
                        "on-tertiary-fixed-variant": "#404757",
                        "on-surface-variant": "#c2c6d6",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#c0c6da",
                        "inverse-on-surface": "#2f3131",
                        "on-tertiary": "#2a3040",
                        "on-primary-fixed": "#001a42",
                        "secondary-container": "#571bc1",
                        "outline-variant": "#424754",
                        "outline": "#8c909f",
                        "secondary": "#d0bcff",
                        "surface-container-high": "#282a2b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "stack-gap": "16px",
                        "margin-desktop": "40px",
                        "touch-target-min": "64px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["18px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["20px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0B1220; min-height: max(884px, 100dvh); }
        .glass-panel { background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .electric-border { border: 3px solid #005ac2; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg pb-[120px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-[touch-target-min] w-full z-50 bg-background backdrop-blur-md border-b-2 border-white/10 top-0 sticky">
<div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
<button aria-label="Menu" class="h-[touch-target-min] w-[touch-target-min] flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors rounded-full">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">visibility</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-black tracking-tight text-primary dark:text-primary-fixed">AUDIVUE</h1>
</div>
<button onclick="window.location.href='audio_detected.html'" aria-label="Live Status" class="h-[touch-target-min] px-4 flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-variant transition-colors rounded-xl font-label-lg text-label-lg font-bold gap-2">
    <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span> ● LIVE
</button>
</header>

<!-- Main Content Area -->
<main class="flex-grow p-margin-mobile md:p-margin-desktop flex flex-col gap-stack-gap md:gap-gutter max-w-4xl mx-auto w-full pt-6">
<div class="mb-4">
<h2 class="font-headline-md text-headline-md mb-2 text-primary font-bold">Audio Status Monitor</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Persistent state components for auditory feedback and environmental awareness.</p>
</div>

<!-- State A: Speaking -->
<section class="glass-panel rounded-2xl border border-white/10 p-gutter electric-border shadow-2xl relative overflow-hidden flex flex-col gap-stack-gap min-h-[260px]">
<div class="flex items-center gap-3 z-10 relative">
<span class="material-symbols-outlined text-inverse-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-headline-md text-headline-md text-inverse-primary font-bold">State A: Speaking...</span>
</div>

<div class="flex-grow relative w-full rounded-xl overflow-hidden min-h-[100px] bg-black/30 flex items-center justify-center border border-white/5 p-4">
    <div class="flex items-center gap-2 h-12 w-full justify-center">
        <div class="w-2 bg-[#3b82f6] rounded-full h-1/2 animate-pulse"></div>
        <div class="w-2 bg-[#a855f7] rounded-full h-full animate-pulse"></div>
        <div class="w-2 bg-[#3b82f6] rounded-full h-3/4 animate-pulse"></div>
        <div class="w-2 bg-[#a855f7] rounded-full h-full animate-pulse"></div>
        <div class="w-2 bg-[#3b82f6] rounded-full h-1/2 animate-pulse"></div>
    </div>
</div>

<div class="z-10 relative bg-surface-container/90 p-4 rounded-xl border-l-4 border-inverse-primary shadow-md">
<p class="font-headline-md text-xl text-on-background font-bold">"Vehicle approaching from your right."</p>
</div>
</section>

<!-- State B: Ready -->
<section class="glass-panel rounded-2xl border border-white/10 p-gutter shadow-xl relative overflow-hidden flex flex-col gap-stack-gap min-h-[160px]">
<div class="flex items-center gap-3 z-10 relative opacity-90">
<span class="material-symbols-outlined text-on-surface" style="font-size: 32px;">mic</span>
<span class="font-headline-md text-headline-md text-on-surface font-bold">State B: Ready</span>
</div>
<div class="flex-grow flex items-center justify-center py-6">
<!-- Steady horizontal bar -->
<div class="w-full h-[4px] bg-surface-variant rounded-full overflow-hidden relative">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary to-transparent animate-[pulse_2s_ease-in-out_infinite]"></div>
</div>
</div>
</section>
</main>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 bg-surface-container backdrop-blur-xl border-t-2 border-white/10 rounded-t-2xl shadow-2xl">
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl flex-1">
<span class="material-symbols-outlined" style="font-size: 32px;">mic</span>
<span class="font-label-md text-label-md mt-1 hidden sm:block">Ready</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl flex-1">
<span class="material-symbols-outlined" style="font-size: 32px;">settings_suggest</span>
<span class="font-label-md text-label-md mt-1 hidden sm:block">Processing</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl h-[touch-target-min] px-6 border-2 border-primary transition-transform duration-100 scale-95 flex-1 shadow-lg">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-label-md text-label-md mt-1 hidden sm:block font-bold">Speaking</span>
</button>
</nav>

<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Vehicle approaching from your right.", "high");
        }, 600);
    });
</script>
</body>
</html>
