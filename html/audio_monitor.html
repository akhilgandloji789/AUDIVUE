<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Audio Status Monitor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0B1220; min-height: max(884px, 100dvh); font-family: 'Inter', sans-serif; }
        .glass-panel { background-color: rgba(18, 20, 20, 0.75); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .electric-border { border: 3px solid #3b82f6; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg pb-[120px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 bg-background/90 backdrop-blur-md border-b border-white/10 sticky top-0">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<button aria-label="Menu" class="h-10 w-10 flex items-center justify-center text-primary hover:bg-surface-container transition-colors rounded-full">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
<h1 class="font-black text-2xl tracking-tight text-primary">AUDIVUE</h1>
</div>
<button onclick="window.location.href='audio_detected.html'" aria-label="Live Status" class="h-10 px-4 flex items-center justify-center text-primary font-bold hover:bg-surface-container transition-colors rounded-xl text-sm gap-2 border border-primary/30">
    <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span> ● LIVE MONITOR
</button>
</header>

<!-- Main Content Area -->
<main class="flex-grow p-6 flex flex-col gap-6 max-w-4xl mx-auto w-full pt-6">
<div class="mb-2">
<h2 class="text-3xl font-extrabold mb-2 text-primary">Audio Status Monitor</h2>
<p class="text-base text-on-surface-variant">Persistent state components for auditory feedback and environmental awareness.</p>
</div>

<!-- State A: Speaking -->
<section class="glass-panel rounded-3xl p-6 electric-border shadow-2xl relative overflow-hidden flex flex-col gap-4 min-h-[250px]">
<div class="flex items-center gap-3 z-10 relative">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="text-2xl text-primary font-extrabold">State A: Speaking...</span>
</div>

<div class="flex-grow relative w-full rounded-2xl overflow-hidden min-h-[100px] bg-black/40 flex items-center justify-center border border-white/5 p-4">
    <div class="flex items-center gap-2 h-12 w-full justify-center">
        <div class="w-2.5 bg-[#3b82f6] rounded-full h-1/2 animate-pulse"></div>
        <div class="w-2.5 bg-[#a855f7] rounded-full h-full animate-pulse"></div>
        <div class="w-2.5 bg-[#3b82f6] rounded-full h-3/4 animate-pulse"></div>
        <div class="w-2.5 bg-[#a855f7] rounded-full h-full animate-pulse"></div>
        <div class="w-2.5 bg-[#3b82f6] rounded-full h-1/2 animate-pulse"></div>
    </div>
</div>

<div class="z-10 relative bg-surface-container/90 p-4 rounded-2xl border-l-4 border-primary shadow-md">
<p class="text-xl text-on-background font-bold">"Vehicle approaching from your right."</p>
</div>
</section>

<!-- State B: Ready -->
<section class="glass-panel rounded-3xl p-6 shadow-xl relative overflow-hidden flex flex-col gap-4 min-h-[160px]">
<div class="flex items-center gap-3 z-10 relative opacity-90">
<span class="material-symbols-outlined text-on-surface text-3xl">mic</span>
<span class="text-2xl text-on-surface font-extrabold">State B: Ready</span>
</div>
<div class="flex-grow flex items-center justify-center py-6">
<!-- Steady horizontal bar -->
<div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden relative">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary to-transparent animate-[pulse_2s_ease-in-out_infinite]"></div>
</div>
</div>
</section>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 rounded-t-2xl shadow-2xl">
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">mic</span>
<span class="text-xs font-semibold">Ready</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings_suggest</span>
<span class="text-xs font-semibold">Processing</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="text-xs font-bold">Speaking</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Vehicle approaching from your right.", "high");
        }, 500);
    });
</script>
</body>
</html>
