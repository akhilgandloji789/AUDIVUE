<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Environment Mode (Pipeline 1)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "secondary-container": "#571bc1",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .camera-view {
            background-color: #0B1220;
            background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15), transparent 80%), linear-gradient(to bottom, rgba(11, 18, 32, 0.8), rgba(11, 18, 32, 0.95));
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative selection:bg-primary-container">

<!-- Background Camera Viewfinder -->
<div class="absolute inset-0 camera-view z-0">
    <video id="webcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
</div>

<!-- YOLOv8 AR Bounding Box Overlays -->
<div id="arOverlay" class="absolute inset-0 z-10 pointer-events-none">
    <!-- Box 1: Chair -->
    <div class="absolute border-4 border-primary rounded-xl shadow-[0_0_25px_rgba(77,142,255,0.5)] transition-all duration-300" style="top: 30%; left: 15%; width: 26%; height: 42%;">
        <div class="absolute -top-9 left-0 bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface text-sm font-bold rounded-t-lg border-t border-x border-primary/50 flex items-center gap-1.5 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            Chair — 89%
        </div>
    </div>
    <!-- Box 2: Person -->
    <div class="absolute border-4 border-primary rounded-xl shadow-[0_0_25px_rgba(77,142,255,0.5)] transition-all duration-300" style="top: 20%; left: 55%; width: 16%; height: 60%;">
        <div class="absolute -top-9 left-0 bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface text-sm font-bold rounded-t-lg border-t border-x border-primary/50 flex items-center gap-1.5 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            Person — 95%
        </div>
    </div>
    <!-- Box 3: Door -->
    <div class="absolute border-4 border-primary rounded-xl shadow-[0_0_25px_rgba(77,142,255,0.5)] transition-all duration-300" style="top: 12%; left: 76%; width: 18%; height: 75%;">
        <div class="absolute -top-9 left-0 bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface text-sm font-bold rounded-t-lg border-t border-x border-primary/50 flex items-center gap-1.5 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            Door — 92%
        </div>
    </div>
</div>

<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 absolute top-0 bg-background/90 backdrop-blur-md border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-black text-2xl tracking-tight text-primary">AUDIVUE</span>
</div>
<div class="flex items-center gap-3">
    <span class="px-3 py-1 bg-primary-container text-on-primary-container text-xs font-bold rounded-full border border-primary/30 shadow">Obstacle Mode</span>
    <div class="flex items-center gap-2 bg-surface-container px-3.5 py-1.5 rounded-full border border-white/10 shadow">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
        <span class="text-xs font-bold text-on-surface">LIVE</span>
    </div>
</div>
</header>

<!-- Main Caption Card Area -->
<main class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-end pb-32 px-6">
<!-- Spatial Audio Telemetry Caption Card -->
<div class="glass-card rounded-2xl p-6 shadow-2xl pointer-events-auto w-full max-w-2xl mx-auto mb-4 flex items-center gap-5 border border-white/10">
<div class="bg-primary-container w-14 h-14 rounded-full flex items-center justify-center shrink-0 shadow-lg border border-primary/40">
<span class="material-symbols-outlined text-on-primary-container text-3xl animate-pulse" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<div class="flex-1">
    <div class="text-xs text-primary font-bold uppercase tracking-wider mb-1">Spatial Quadrant Telemetry</div>
    <p id="captionText" class="text-xl text-on-surface font-extrabold m-0 leading-snug">
        "Chair ahead, slightly left, close."
    </p>
</div>
</div>
</main>

<!-- Floating Action Button: Switch to Currency Mode -->
<button onclick="window.location.href='mode_transition.html'" title="Switch to Currency Mode" class="absolute bottom-32 right-6 w-16 h-16 bg-secondary-container text-on-secondary-container rounded-full shadow-2xl flex items-center justify-center z-40 hover:bg-secondary transition-all pointer-events-auto border-2 border-secondary/50 focus:outline-none active:scale-95">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</button>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<!-- Ready -->
<button onclick="window.location.href='audio_detected.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">mic</span>
<span class="text-xs font-semibold">Ready</span>
</button>
<!-- Alerts -->
<button onclick="window.location.href='alerts.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">warning</span>
<span class="text-xs font-semibold">Alerts</span>
</button>
<!-- Active: Vision Mode -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="text-xs font-bold">Speaking</span>
</button>
<!-- Settings -->
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-xs font-semibold">Settings</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakObstacleAlert('Chair', 'slightly left', 'close', false);
        }, 600);
    });
</script>
</body>
</html>
