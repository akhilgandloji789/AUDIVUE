<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Obstacle Vision Mode</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#000;overflow:hidden;height:100dvh;}
  .viewfinder{position:fixed;inset:0;z-index:0;}
  .viewfinder video{width:100%;height:100%;object-fit:cover;opacity:1;display:block;}
  .ar-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .ar-box{position:absolute;border:2.5px solid #4d8eff;border-radius:10px;box-shadow:0 0 18px rgba(77,142,255,0.5);}
  .ar-label{position:absolute;top:-30px;left:0;padding:3px 10px;background:rgba(8,14,28,0.93);border:1px solid rgba(77,142,255,0.5);border-radius:6px 6px 0 0;font-size:12px;font-weight:700;color:#adc6ff;display:flex;align-items:center;gap:5px;white-space:nowrap;backdrop-filter:blur(8px);font-family:Inter,sans-serif;}
  .ar-dot{width:6px;height:6px;border-radius:50%;background:#4d8eff;animation:blinkDot 1.2s ease-in-out infinite;}
  @keyframes blinkDot{0%,100%{opacity:1}50%{opacity:0.15}}
  .top-bar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;font-family:Inter,sans-serif;}
  .hdr-right{display:flex;align-items:center;gap:8px;}
  .badge-mode{padding:4px 12px;border-radius:20px;background:rgba(77,142,255,0.14);border:1px solid rgba(77,142,255,0.38);font-size:11px;font-weight:700;color:#adc6ff;text-transform:uppercase;letter-spacing:0.05em;font-family:Inter,sans-serif;}
  .badge-live{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);font-size:10px;font-weight:700;color:#f87171;font-family:Inter,sans-serif;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pingDot 1.5s cubic-bezier(0,0,0.2,1) infinite;}
  @keyframes pingDot{75%,100%{transform:scale(2);opacity:0;}}
  .icon-btn{width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,0.07);color:#c2c6d6;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .icon-btn .ms{font-size:20px;}
  .bottom-overlay{position:fixed;bottom:16px;left:0;right:0;z-index:40;padding:0 14px;}
  .caption-card{background:rgba(12,17,30,0.91);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;}
  .cap-icon{width:46px;height:46px;border-radius:50%;background:#4d8eff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 14px rgba(77,142,255,0.38);}
  .cap-icon .ms{font-size:24px;color:#001a42;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .cap-meta{font-size:10px;color:#adc6ff;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;font-family:Inter,sans-serif;}
  .cap-text{font-size:15px;font-weight:800;color:#e2e2e2;line-height:1.3;font-family:Inter,sans-serif;margin:0;}
  .waveform{display:flex;align-items:center;gap:3px;height:18px;margin-top:7px;}
  .wv{width:3px;border-radius:2px;background:#4d8eff;}
  .wv1{animation:wvA 1s 0s ease-in-out infinite;height:35%;}
  .wv2{animation:wvA 1.2s 0.1s ease-in-out infinite;height:65%;}
  .wv3{animation:wvA 0.9s 0.2s ease-in-out infinite;height:100%;}
  .wv4{animation:wvA 1.1s 0.3s ease-in-out infinite;height:55%;}
  .wv5{animation:wvA 1.3s 0.4s ease-in-out infinite;height:80%;}
  .wv6{animation:wvA 1s 0.15s ease-in-out infinite;height:40%;}
  @keyframes wvA{0%,100%{height:20%}50%{height:100%}}
  @media(max-width:360px){.cap-text{font-size:13px;}.logo-link h1{font-size:17px;}.badge-mode{display:none;}}
</style>
</head>
<body>

<!-- Live Camera Viewfinder -->
<div class="viewfinder">
  <video id="camFeed" autoplay playsinline muted></video>
</div>

<!-- AR Bounding Box Overlay -->
<div class="ar-layer" id="arLayer"></div>

<!-- Top App Bar -->
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div class="hdr-right">
    <span class="badge-mode" id="engineBadge">FastAPI + YOLO11 (PyTorch) Stream</span>
    <div class="badge-live"><span class="live-dot"></span>LIVE</div>
    <button class="icon-btn" id="muteBtn" title="Mute / Unmute voice">
      <span class="ms material-symbols-outlined" id="muteIcon">volume_up</span>
    </button>
    <div style="position:relative;">
      <button class="icon-btn" id="profileBtn" title="Profile / Account" style="background:rgba(77,142,255,0.15);border:1px solid rgba(77,142,255,0.35);">
        <span class="ms material-symbols-outlined" style="color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">account_circle</span>
      </button>

      <!-- Profile Dropdown Menu -->
      <div id="profileDropdown" style="display:none;position:absolute;top:48px;right:0;width:240px;background:rgba(12,17,30,0.96);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:100;font-family:Inter,sans-serif;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08);">
          <div style="width:38px;height:38px;border-radius:50%;background:rgba(77,142,255,0.2);display:flex;align-items:center;justify-content:center;color:#4d8eff;font-weight:700;font-size:16px;" id="userAvatar">A</div>
          <div style="overflow:hidden;text-align:left;">
            <div style="font-size:14px;font-weight:700;color:#e2e2e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="userName">Alex Morgan</div>
            <div style="font-size:11px;color:#8c909f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="userEmail">alex@audivue.ai</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#34d399;font-weight:700;margin-bottom:14px;background:rgba(52,211,153,0.1);padding:4px 8px;border-radius:8px;">
          <span style="width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;"></span>Firebase Auth Active
        </div>
        <button id="logoutBtn" onclick="handleGoogleSignOut()" style="width:100%;height:40px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.35);color:#f87171;font-weight:700;font-size:13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;">
          <span class="ms material-symbols-outlined" style="font-size:18px;">logout</span>Sign Out / Logout
        </button>
      </div>
    </div>
  </div>
</header>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../assets/firebase_auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<!-- Spatial Caption Card -->
<div class="bottom-overlay">
  <div class="caption-card">
    <div class="cap-icon"><span class="ms material-symbols-outlined">volume_up</span></div>
    <div style="flex:1;">
      <div class="cap-meta">Spatial Quadrant Telemetry</div>
      <p class="cap-text" id="captionText">"Scanning environment for real-time obstacles..."</p>
      <div class="waveform">
        <div class="wv wv1"></div><div class="wv wv2"></div><div class="wv wv3"></div>
        <div class="wv wv4"></div><div class="wv wv5"></div><div class="wv wv6"></div>
      </div>
    </div>
  </div>
</div>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
let va = null, isMuted = false;

document.addEventListener('DOMContentLoaded', async () => {
  // Start webcam
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      document.getElementById('camFeed').srcObject = stream;
    }
  } catch (e) {
    document.getElementById('camFeed').parentElement.style.background = 'radial-gradient(circle at 50% 50%,rgba(30,40,80,0.9),#0B1220)';
  }

  // Voice assistant
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    va = new AudivueVoiceAssistant({
      rate: 1.05, pitch: 1.0, defaultMode: 'obstacle',
      onModeChange: (mode) => {
        if (mode === 'currency') window.location.href = 'mode_transition.html';
      }
    });
    va.startListening();
  }

  // Profile dropdown menu toggle & user profile setup
  const profileBtn = document.getElementById('profileBtn');
  const profileDropdown = document.getElementById('profileDropdown');
  if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.style.display = profileDropdown.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', () => {
      profileDropdown.style.display = 'none';
    });
  }

  // Populate Firebase / User details
  if (typeof getAudivueUser === 'function') {
    const u = getAudivueUser();
    if (u) {
      if (document.getElementById('userName')) document.getElementById('userName').textContent = u.name;
      if (document.getElementById('userEmail')) document.getElementById('userEmail').textContent = u.email;
      if (document.getElementById('userAvatar')) document.getElementById('userAvatar').textContent = u.name.charAt(0).toUpperCase();
    }
  }

  // Mute button
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (!va) return;
    isMuted = va.toggleMute();
    document.getElementById('muteIcon').textContent = isMuted ? 'volume_off' : 'volume_up';
    document.getElementById('muteBtn').style.background = isMuted ? 'rgba(255,180,171,0.15)' : 'rgba(255,255,255,0.07)';
  });

  // Live Real-Time YOLOv8 Detection Loop from Extracted Repo
  // High-Speed FastAPI WebSocket Connection for Real-Time YOLO11 Inference
  const videoEl = document.getElementById('camFeed');
  const arLayer = document.getElementById('arLayer');
  const captionEl = document.getElementById('captionText');
  const hiddenCanvas = document.createElement('canvas');
  const hiddenCtx = hiddenCanvas.getContext('2d');
  let lastSpokenText = "";
  let lastSpokenTime = 0;

  function handleDetectionData(data) {
    if (data.engine && document.getElementById('engineBadge')) {
      document.getElementById('engineBadge').textContent = data.engine;
    }
    
    if (data.status === 'success' && Array.isArray(data.detections)) {
      arLayer.innerHTML = '';

      // If no objects detected, clear screen & reset caption silently
      if (data.detections.length === 0) {
        captionEl.textContent = '"Scanning environment for real-time obstacles..."';
        lastSpokenText = "";
        return;
      }

      data.detections.forEach(det => {
        const box = document.createElement('div');
        box.className = 'ar-box';
        box.style.top = det.bbox_pct.top + '%';
        box.style.left = det.bbox_pct.left + '%';
        box.style.width = det.bbox_pct.width + '%';
        box.style.height = det.bbox_pct.height + '%';
        if (det.proximity === 'Close') {
          box.style.borderColor = '#ffb4ab';
          box.style.boxShadow = '0 0 18px rgba(255,180,171,0.6)';
        }
        box.innerHTML = `<div class="ar-label"><span class="ar-dot"></span>${det.label} — ${Math.round(det.confidence * 100)}% (${det.position}, ${det.proximity})</div>`;
        arLayer.appendChild(box);
      });

      const now = Date.now();
      // Enforce speech deduplication & 8-second cooldown for repeating identical phrases
      if (data.spoken_summary && (data.spoken_summary !== lastSpokenText || (now - lastSpokenTime) > 8000)) {
        captionEl.textContent = `"${data.spoken_summary}"`;
        if (va && !isMuted) {
          va.speak(data.spoken_summary, 'normal');
        }
        lastSpokenText = data.spoken_summary;
        lastSpokenTime = now;
      }
    }
  }

  // Connect WebSocket & REST API to FastAPI YOLO Server
  let ws = null;
  let isSendingRest = false;

  function getBackendWsUrls() {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      return [
        `ws://localhost:8000/ws/detect`,
        `wss://audivue-backend-kray.onrender.com/ws/detect`
      ];
    }
    return [
      `wss://audivue-backend-kray.onrender.com/ws/detect`,
      `ws://localhost:8000/ws/detect`
    ];
  }

  let backendIdx = 0;
  function initWebSocket() {
    const urls = getBackendWsUrls();
    const targetUrl = urls[backendIdx % urls.length];
    console.log('[AUDIVUE] Connecting to YOLO AI Stream:', targetUrl);
    
    try {
      ws = new WebSocket(targetUrl);
      ws.onopen = () => {
        console.log('[AUDIVUE] Connected to FastAPI WebSocket AI Stream:', targetUrl);
        if (document.getElementById('engineBadge')) {
          document.getElementById('engineBadge').textContent = "FASTAPI + YOLO11 (PYTORCH) STREAM";
        }
      };
      ws.onmessage = (evt) => {
        try {
          const data = JSON.parse(evt.data);
          handleDetectionData(data);
        } catch(e){}
      };
      ws.onerror = () => {
        backendIdx++;
      };
      ws.onclose = () => {
        backendIdx++;
        setTimeout(initWebSocket, 2000);
      };
    } catch (e) {
      backendIdx++;
      setTimeout(initWebSocket, 2000);
    }
  }
  initWebSocket();

  // Initialize Client-Side In-Browser AI Engine (COCO-SSD / TensorFlow.js)
  let cocoModel = null;
  if (typeof cocoSsd !== 'undefined') {
    cocoSsd.load().then(m => {
      cocoModel = m;
      console.log('[AUDIVUE Client AI] In-Browser COCO-SSD Model Loaded Ready!');
      if (document.getElementById('engineBadge') && (!ws || ws.readyState !== WebSocket.OPEN)) {
        document.getElementById('engineBadge').textContent = "IN-BROWSER AI ENGINE READY";
      }
    }).catch(e => console.warn(e));
  }

  // Client-Side Real-Time Inference Loop
  async function runClientInference() {
    if (!cocoModel || !videoEl || videoEl.paused || videoEl.ended || !videoEl.videoWidth) return;
    try {
      const predictions = await cocoModel.detect(videoEl);
      if (!predictions || predictions.length === 0) {
        handleDetectionData({
          status: 'success',
          engine: 'IN-BROWSER AI ENGINE (REAL-TIME)',
          detections: [],
          spoken_summary: ''
        });
        return;
      }

      const vW = videoEl.videoWidth || 640;
      const vH = videoEl.videoHeight || 480;
      
      const detections = predictions.map(p => {
        const [x, y, w, h] = p.bbox;
        const leftPct = (x / vW) * 100;
        const topPct = (y / vH) * 100;
        const widthPct = (w / vW) * 100;
        const heightPct = (h / vH) * 100;
        
        const centerX = (x + w / 2) / vW;
        const areaPct = (w * h) / (vW * vH);
        
        let position = 'Center';
        if (centerX < 0.38) position = 'Left';
        else if (centerX > 0.62) position = 'Right';
        
        let proximity = 'Far';
        if (areaPct > 0.12) proximity = 'Close';
        else if (areaPct > 0.03) proximity = 'Medium';
        
        return {
          label: p.class.toUpperCase(),
          confidence: p.score,
          position: position,
          proximity: proximity,
          bbox_pct: { left: leftPct, top: topPct, width: widthPct, height: heightPct }
        };
      });
      
      const topDet = detections[0];
      const spoken = `${topDet.label} detected in ${topDet.position} quadrant — ${topDet.proximity} proximity.`;
      
      handleDetectionData({
        status: 'success',
        engine: 'IN-BROWSER AI ENGINE (REAL-TIME)',
        detections: detections,
        spoken_summary: spoken
      });
    } catch(err){}
  }

  setInterval(() => {
    // Run client-side AI detection if server WebSocket is connecting/unavailable
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      runClientInference();
    }
  }, 180);

  // Dual Frame Streamer: Primary WebSocket (12 FPS) + Fallback HTTP REST POST
  setInterval(async () => {
    if (!videoEl || !videoEl.videoWidth || videoEl.paused) return;

    hiddenCanvas.width = 480;
    hiddenCanvas.height = Math.round(480 * (videoEl.videoHeight / videoEl.videoWidth));
    hiddenCtx.drawImage(videoEl, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

    // 1. Try WebSocket binary streaming if connected
    if (ws && ws.readyState === WebSocket.OPEN) {
      hiddenCanvas.toBlob((blob) => {
        if (blob && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(blob);
        }
      }, 'image/jpeg', 0.6);
      return;
    }

    // 2. HTTP REST POST Fallback if WebSocket connecting
    if (!isSendingRest) {
      isSendingRest = true;
      try {
        const dataUrl = hiddenCanvas.toDataURL('image/jpeg', 0.5);
        const restEndpoint = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
          ? '/api/detect_obstacle'
          : 'https://audivue-backend-kray.onrender.com/api/detect_obstacle';

        const res = await fetch(restEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: dataUrl })
        });
        if (res.ok) {
          const data = await res.json();
          handleDetectionData(data);
        }
      } catch (e) {
        console.warn('[AUDIVUE REST Fallback] Notice:', e);
      } finally {
        isSendingRest = false;
      }
    }
  }, 90);
});
</script>
</body>
</html>
