<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Obstacle Vision Mode</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#000;overflow:hidden;height:100dvh;}
  .viewfinder{position:fixed;inset:0;z-index:0;}
  .viewfinder video{width:100%;height:100%;object-fit:cover;opacity:1;display:block;}
  .ar-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .ar-box{position:absolute;border:2.5px solid #4d8eff;border-radius:10px;box-shadow:0 0 18px rgba(77,142,255,0.5);}
  .ar-label{position:absolute;top:-30px;left:0;padding:3px 10px;background:rgba(8,14,28,0.93);border:1px solid rgba(77,142,255,0.5);border-radius:6px 6px 0 0;font-size:12px;font-weight:700;color:#adc6ff;display:flex;align-items:center;gap:5px;white-space:nowrap;backdrop-filter:blur(8px);font-family:Inter,sans-serif;}
  .ar-dot{width:6px;height:6px;border-radius:50%;background:#4d8eff;animation:blinkDot 1.2s ease-in-out infinite;}
  @keyframes blinkDot{0%,100%{opacity:1}50%{opacity:0.15}}
  .top-bar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;font-family:Inter,sans-serif;}
  .hdr-right{display:flex;align-items:center;gap:8px;}
  .badge-mode{padding:4px 12px;border-radius:20px;background:rgba(77,142,255,0.14);border:1px solid rgba(77,142,255,0.38);font-size:11px;font-weight:700;color:#adc6ff;text-transform:uppercase;letter-spacing:0.05em;font-family:Inter,sans-serif;}
  .badge-live{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);font-size:10px;font-weight:700;color:#f87171;font-family:Inter,sans-serif;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pingDot 1.5s cubic-bezier(0,0,0.2,1) infinite;}
  @keyframes pingDot{75%,100%{transform:scale(2);opacity:0;}}
  .icon-btn{width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,0.07);color:#c2c6d6;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .icon-btn .ms{font-size:20px;}
  .bottom-overlay{position:fixed;bottom:80px;left:0;right:0;z-index:40;padding:0 14px 12px;}
  .caption-card{background:rgba(12,17,30,0.91);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;}
  .cap-icon{width:46px;height:46px;border-radius:50%;background:#4d8eff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 14px rgba(77,142,255,0.38);}
  .cap-icon .ms{font-size:24px;color:#001a42;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .cap-meta{font-size:10px;color:#adc6ff;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;font-family:Inter,sans-serif;}
  .cap-text{font-size:15px;font-weight:800;color:#e2e2e2;line-height:1.3;font-family:Inter,sans-serif;margin:0;}
  .waveform{display:flex;align-items:center;gap:3px;height:18px;margin-top:7px;}
  .wv{width:3px;border-radius:2px;background:#4d8eff;}
  .wv1{animation:wvA 1s 0s ease-in-out infinite;height:35%;}
  .wv2{animation:wvA 1.2s 0.1s ease-in-out infinite;height:65%;}
  .wv3{animation:wvA 0.9s 0.2s ease-in-out infinite;height:100%;}
  .wv4{animation:wvA 1.1s 0.3s ease-in-out infinite;height:55%;}
  .wv5{animation:wvA 1.3s 0.4s ease-in-out infinite;height:80%;}
  .wv6{animation:wvA 1s 0.15s ease-in-out infinite;height:40%;}
  @keyframes wvA{0%,100%{height:20%}50%{height:100%}}
  .fab{position:fixed;bottom:92px;right:16px;z-index:45;width:52px;height:52px;border-radius:16px;border:none;background:#a855f7;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(168,85,247,0.4);transition:all 0.15s;}
  .fab:hover{background:#9333ea;}.fab:active{transform:scale(0.95);}
  .fab .ms{font-size:26px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;letter-spacing:0.02em;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn.active{background:#adc6ff;color:#001a42;font-weight:700;}
  .nav-btn.active .ms{font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 24;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
  @media(max-width:360px){.cap-text{font-size:13px;}.logo-link h1{font-size:17px;}.badge-mode{display:none;}}
</style>
</head>
<body>

<!-- Live Camera Viewfinder -->
<div class="viewfinder">
  <video id="camFeed" autoplay playsinline muted></video>
</div>

<!-- AR Bounding Box Overlay -->
<div class="ar-layer" id="arLayer">
  <div class="ar-box" style="top:28%;left:10%;width:24%;height:40%;" id="boxChair">
    <div class="ar-label"><span class="ar-dot"></span>Chair — 89%</div>
  </div>
  <div class="ar-box" style="top:17%;left:52%;width:14%;height:58%;" id="boxPerson">
    <div class="ar-label"><span class="ar-dot"></span>Person — 95%</div>
  </div>
  <div class="ar-box" style="top:9%;left:72%;width:16%;height:73%;" id="boxDoor">
    <div class="ar-label"><span class="ar-dot"></span>Door — 92%</div>
  </div>
</div>

<!-- Top App Bar -->
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div class="hdr-right">
    <span class="badge-mode">Obstacle Mode</span>
    <div class="badge-live"><span class="live-dot"></span>LIVE</div>
    <button class="icon-btn" id="muteBtn" title="Mute / Unmute voice">
      <span class="ms material-symbols-outlined" id="muteIcon">volume_up</span>
    </button>
  </div>
</header>

<!-- FAB: Currency Mode -->
<button class="fab" onclick="window.location.href='mode_transition.html'" title="Switch to Currency Mode">
  <span class="ms material-symbols-outlined">payments</span>
</button>

<!-- Spatial Caption Card -->
<div class="bottom-overlay">
  <div class="caption-card">
    <div class="cap-icon"><span class="ms material-symbols-outlined">volume_up</span></div>
    <div style="flex:1;">
      <div class="cap-meta">Spatial Quadrant Telemetry</div>
      <p class="cap-text" id="captionText">"Chair ahead left, close. Person center. Door right, open."</p>
      <div class="waveform">
        <div class="wv wv1"></div><div class="wv wv2"></div><div class="wv wv3"></div>
        <div class="wv wv4"></div><div class="wv wv5"></div><div class="wv wv6"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-btn active" title="Obstacle Vision Mode">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'" title="Safety Alerts">
    <span class="ms material-symbols-outlined">crisis_alert</span>Alerts
  </button>
  <button class="nav-btn" onclick="window.location.href='mode_transition.html'" title="Currency Mode">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'" title="Audio">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'" title="Settings">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
let va = null, isMuted = false;

document.addEventListener('DOMContentLoaded', async () => {
  // Start webcam
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      document.getElementById('camFeed').srcObject = stream;
    }
  } catch (e) {
    document.getElementById('camFeed').parentElement.style.background = 'radial-gradient(circle at 50% 50%,rgba(30,40,80,0.9),#0B1220)';
  }

  // Voice assistant
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    va = new AudivueVoiceAssistant({
      rate: 1.05, pitch: 1.0,
      onModeChange: (mode) => {
        if (mode === 'currency') window.location.href = 'mode_transition.html';
      }
    });
    va.startListening();
    setTimeout(() => {
      va.speakObstacleAlert('Chair, Person and Door', 'left, center and right', 'various distances', false);
    }, 700);
  }

  // Mute button
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (!va) return;
    isMuted = va.toggleMute();
    document.getElementById('muteIcon').textContent = isMuted ? 'volume_off' : 'volume_up';
    document.getElementById('muteBtn').style.background = isMuted ? 'rgba(255,180,171,0.15)' : 'rgba(255,255,255,0.07)';
  });

  // Live Real-Time YOLOv8 Detection Loop from Extracted Repo
  const videoEl = document.getElementById('camFeed');
  const arLayer = document.getElementById('arLayer');
  const captionEl = document.getElementById('captionText');
  const hiddenCanvas = document.createElement('canvas');
  const hiddenCtx = hiddenCanvas.getContext('2d');
  let lastSpokenText = "";
  let isDetecting = false;

  async function captureAndDetect() {
    if (isDetecting || !videoEl || videoEl.paused || videoEl.ended || !videoEl.videoWidth) return;
    isDetecting = true;

    try {
      hiddenCanvas.width = 480;
      hiddenCanvas.height = Math.round(480 * (videoEl.videoHeight / videoEl.videoWidth));
      hiddenCtx.drawImage(videoEl, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
      const base64Image = hiddenCanvas.toDataURL('image/jpeg', 0.6);

      const response = await fetch('/api/detect_obstacle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64Image })
      });

      if (response.ok) {
        const data = await response.json();
        if (data.status === 'success' && Array.isArray(data.detections)) {
          // If real detections found from backend YOLO model
          if (data.detections.length > 0) {
            arLayer.innerHTML = '';
            data.detections.forEach(det => {
              const box = document.createElement('div');
              box.className = 'ar-box';
              box.style.top = det.bbox_pct.top + '%';
              box.style.left = det.bbox_pct.left + '%';
              box.style.width = det.bbox_pct.width + '%';
              box.style.height = det.bbox_pct.height + '%';
              if (det.proximity === 'Close') {
                box.style.borderColor = '#ffb4ab';
                box.style.boxShadow = '0 0 18px rgba(255,180,171,0.6)';
              }
              box.innerHTML = `<div class="ar-label"><span class="ar-dot"></span>${det.label} — ${Math.round(det.confidence * 100)}% (${det.position}, ${det.proximity})</div>`;
              arLayer.appendChild(box);
            });
          }

          if (data.spoken_summary && data.spoken_summary !== lastSpokenText) {
            captionEl.textContent = `"${data.spoken_summary}"`;
            if (va && !isMuted) {
              va.speak(data.spoken_summary, 'normal');
            }
            lastSpokenText = data.spoken_summary;
          }
        }
      }
    } catch (err) {
      // Backend offline or loading - keep default AR view
    } finally {
      isDetecting = false;
    }
  }

  // Poll backend YOLO model every 400ms
  setInterval(captureAndDetect, 400);
});
</script>
</body>
</html>
