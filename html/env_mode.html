<style>
.camera-view {
    background-color: #0B1220;
    background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15), transparent 80%), linear-gradient(to bottom, rgba(11, 18, 32, 0.8), rgba(11, 18, 32, 0.95));

<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md relative selection:bg-primary-container selection:text-on-primary-container">

<!-- Background Camera View Viewfinder -->
<div class="absolute inset-0 camera-view z-0">
    <video id="webcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40"></video>
</div>

<!-- Bounding Boxes (Simulated YOLOv8 AR Overlay) -->
<div id="arOverlay" class="absolute inset-0 z-10 pointer-events-none">
    <!-- Box 1 (Chair) -->
    <div class="absolute border-4 border-primary rounded-lg shadow-[0_0_20px_rgba(77,142,255,0.4)]" style="top: 30%; left: 15%; width: 25%; height: 40%;">
        <div class="absolute top-0 left-0 -translate-y-full bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface font-label-lg rounded-t-lg border-t border-x border-primary/50">
            Chair — 89%
        </div>
    </div>
    <!-- Box 2 (Person) -->
    <div class="absolute border-4 border-primary rounded-lg shadow-[0_0_20px_rgba(77,142,255,0.4)]" style="top: 20%; left: 55%; width: 15%; height: 60%;">
        <div class="absolute top-0 left-0 -translate-y-full bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface font-label-lg rounded-t-lg border-t border-x border-primary/50">
            Person — 95%
        </div>
    </div>
    <!-- Box 3 (Door) -->
    <div class="absolute border-4 border-primary rounded-lg shadow-[0_0_20px_rgba(77,142,255,0.4)]" style="top: 10%; left: 78%; width: 18%; height: 80%;">
        <div class="absolute top-0 left-0 -translate-y-full bg-surface-container/95 backdrop-blur-md px-3 py-1 text-on-surface font-label-lg rounded-t-lg border-t border-x border-primary/50">
            Door — 92%
        </div>
    </div>
</div>

<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-[touch-target-min] w-full z-50 absolute top-0 bg-background/90 backdrop-blur-md border-b-2 border-white/10">
<div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary font-headline-lg" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-headline-lg text-headline-lg font-black tracking-tight text-primary">AUDIVUE</span>
</div>
<div class="flex items-center gap-3">
    <span class="px-3 py-1 bg-primary-container text-on-primary-container text-xs font-bold rounded-full border border-primary/30">Obstacle Mode</span>
    <div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline/20">
        <span class="text-error animate-pulse text-sm">●</span>
        <span class="font-label-md text-label-md text-on-surface">LIVE</span>
    </div>
</div>
</header>

<!-- Main Content Canvas (Caption & Audio Card) -->
<main class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-end pb-32 px-margin-mobile gap-stack-gap">
<!-- Persistent Caption Card -->
<div class="bg-surface-container/95 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-2xl pointer-events-auto w-full max-w-2xl mx-auto mb-4 flex items-center gap-6">
<div class="bg-primary-container w-[touch-target-min] h-[touch-target-min] rounded-full flex items-center justify-center shrink-0 shadow-lg">
<span class="material-symbols-outlined text-on-primary-container text-4xl animate-pulse" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<div class="flex-1">
    <div class="text-xs text-primary font-bold uppercase tracking-wider mb-1">Spatial Alert Telemetry</div>
    <p id="captionText" class="font-body-lg text-body-lg text-on-surface m-0 leading-relaxed font-semibold">
        "Chair ahead, slightly left, close."
    </p>
</div>
</div>
</main>

<!-- Floating Action Button (Switch to Currency Mode) -->
<button onclick="window.location.href='currency_mode.html'" title="Switch to Currency Mode" class="absolute bottom-32 right-margin-mobile w-[touch-target-min] h-[touch-target-min] bg-secondary-container text-on-secondary-container rounded-full shadow-2xl flex items-center justify-center z-40 hover:bg-secondary-fixed transition-all pointer-events-auto border-2 border-primary/50 focus:border-white focus:outline-none active:scale-95">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</button>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 bg-surface-container/95 backdrop-blur-xl border-t-2 border-white/10 shadow-lg rounded-t-xl">
<!-- Ready (Inactive) -->
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl">
<span class="material-symbols-outlined mb-1 text-3xl">mic</span>
<span class="font-label-lg text-label-lg text-sm">Ready</span>
</button>
<!-- Alerts (Inactive) -->

<span class="material-symbols-outlined mb-1 text-3xl">warning</span>
<span class="font-label-lg text-label-lg text-sm">Alerts</span>
</button>
<!-- Speaking / Obstacle (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl h-[touch-target-min] px-6 border-2 border-primary scale-98 transition-transform duration-100">
<span class="material-symbols-outlined mb-1 text-3xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-label-lg text-label-lg text-sm font-bold">Speaking</span>
</button>
</nav>

<!-- Load AUDIVUE Voice Assistant for Live Voice Alerts -->
<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Attempt webcam stream binding
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const videoElement = document.getElementById('webcamFeed');
                videoElement.srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam feed preview fallback to AR mockup');
        }

        // Initialize voice assistant to speak spatial alert
        const assistant = new AudivueVoiceAssistant({
            rate: 1.05,
            pitch: 1.0
        });

        setTimeout(() => {
            assistant.speakObstacleAlert('Chair', 'slightly left', 'close', false);
        }, 800);
    });
</script>
</body>
