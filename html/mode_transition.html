<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Mode Transition</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#adc6ff",
                      "primary-container": "#4d8eff",
                      "background": "#0B1220",
                      "surface": "#121414",
                      "surface-container": "#1e2020",
                      "on-surface": "#e2e2e2",
                      "on-surface-variant": "#c2c6d6"
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
        .spinner-path { animation: dash 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans relative overflow-hidden">

<!-- Background Camera Feed Simulation -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="transitionWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-40 blur-sm"></video>
    <div class="absolute inset-0 bg-background/60 backdrop-blur-sm"></div>
</div>

<!-- TopAppBar -->
<header class="bg-surface-container/90 backdrop-blur-md text-primary flex justify-between items-center w-full px-6 h-16 fixed top-0 z-50 border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-extrabold text-2xl tracking-tight text-primary">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-xs font-bold text-primary uppercase tracking-wider bg-primary-container/20 px-3 py-1 rounded-full border border-primary/30">MODE SWITCH</span>
</div>
</header>

<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center relative z-10 px-6 pt-16 pb-24">
<div class="glass-card rounded-3xl p-8 border border-white/10 shadow-2xl flex flex-col items-center gap-6 w-full max-w-sm text-center">
<!-- SVG Loading Spinner -->
<div class="relative w-20 h-20 flex items-center justify-center">
<svg class="animate-spin w-full h-full text-primary" viewbox="0 0 50 50">
<circle class="opacity-20" cx="25" cy="25" fill="none" r="20" stroke="currentColor" stroke-width="4"></circle>
<circle class="spinner-path" cx="25" cy="25" fill="none" r="20" stroke="currentColor" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<span class="material-symbols-outlined text-primary text-2xl absolute" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>

<div class="space-y-2">
<h2 class="text-2xl font-extrabold text-on-surface">Switching to Currency Mode...</h2>
<p class="text-base text-on-surface-variant">Optimizing vision sensors for denomination recognition.</p>
</div>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="bg-surface/95 backdrop-blur-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-4 h-24 rounded-t-2xl border-t border-white/10 shadow-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">check_circle</span>
<span class="text-xs font-semibold">Ready</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">settings_slow_motion</span>
<span class="text-xs font-bold">Processing</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">payments</span>
<span class="text-xs font-semibold">Currency</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('transitionWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Switching to Currency Mode. Optimizing sensors.", "high");
        }, 300);

        // Auto transition to currency_mode.html after 2.5s
        setTimeout(() => {
            window.location.href = 'currency_mode.html';
        }, 2500);
    });
</script>
</body>
</html>
