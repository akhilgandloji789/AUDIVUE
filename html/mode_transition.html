<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Switching Mode</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  @keyframes spinAnim{to{transform:rotate(360deg)}}
  @keyframes dashAnim{0%{stroke-dasharray:1,150;stroke-dashoffset:0}50%{stroke-dasharray:90,150;stroke-dashoffset:-35}100%{stroke-dasharray:90,150;stroke-dashoffset:-124}}
  @keyframes slideUpAnim{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .spin-svg{animation:spinAnim 1.2s linear infinite;transform-origin:center;}
  .dash-ring{animation:dashAnim 1.5s ease-in-out infinite;}
  .slide-up{animation:slideUpAnim 0.4s ease both;}
  .top-bar-fix{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-link .material-symbols-outlined{font-size:28px;color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:22px;font-weight:900;color:#adc6ff;margin:0;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(12,15,15,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.07);padding:0 8px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;}
  .nav-btn .material-symbols-outlined{font-size:22px;}
</style>
</head>
<body style="background:#0B1220;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,sans-serif;">
<header class="top-bar-fix">
  <a class="logo-link" href="index.html"><span class="material-symbols-outlined">visibility</span><h1>AUDIVUE</h1></a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(77,142,255,0.1);border:1px solid rgba(77,142,255,0.3);color:#adc6ff;">MODE SWITCH</div>
</header>
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px 24px 96px;">
  <div class="glass slide-up" style="border-radius:24px;padding:40px 28px;max-width:360px;width:100%;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4d8eff,#a855f7);"></div>
    <div style="position:relative;width:72px;height:72px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;">
      <svg class="spin-svg" width="72" height="72" viewBox="0 0 72 72" fill="none" style="position:absolute;inset:0;">
        <circle cx="36" cy="36" r="30" stroke="rgba(168,85,247,0.15)" stroke-width="5"/>
        <circle cx="36" cy="36" r="30" stroke="#a855f7" stroke-width="5" stroke-linecap="round" class="dash-ring"/>
      </svg>
      <span class="material-symbols-outlined" style="position:relative;font-size:28px;color:#a855f7;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">payments</span>
    </div>
    <h2 style="font-size:22px;font-weight:800;color:#e2e2e2;margin:0 0 8px;">Switching to Currency Mode</h2>
    <p style="font-size:14px;color:#8c909f;line-height:1.5;">Optimizing vision sensors for denomination recognition...</p>
  </div>
</main>
<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'"><span class="material-symbols-outlined">visibility</span>Vision</button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'"><span class="material-symbols-outlined">crisis_alert</span>Alerts</button>
  <button class="nav-btn" style="color:#a855f7;"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">payments</span>Currency</button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'"><span class="material-symbols-outlined">graphic_eq</span>Audio</button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'"><span class="material-symbols-outlined">settings</span>Settings</button>
</nav>
<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof AudivueVoiceAssistant!=='undefined'){
    const va=new AudivueVoiceAssistant({rate:1.05,pitch:1.0});
    setTimeout(()=>va.speak('Switching to Currency Mode. Optimizing sensors.','high'),300);
  }
  setTimeout(()=>window.location.href='currency_mode.html',2500);
});
</script>
</body>
</html>
