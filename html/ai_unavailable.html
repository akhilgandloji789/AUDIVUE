<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — AI Unavailable</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#0B1220;min-height:100dvh;display:flex;flex-direction:column;font-family:Inter,sans-serif;}
  @keyframes slideUpAnim{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slide-up{animation:slideUpAnim 0.45s cubic-bezier(0.16,1,0.3,1) both;}
  .top-bar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .btn-p{width:100%;height:56px;background:#4d8eff;color:#001a42;font-weight:700;font-size:16px;font-family:Inter,sans-serif;border:none;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;box-shadow:0 4px 20px rgba(77,142,255,0.3);}
  .btn-p:hover{background:#5a97ff;}.btn-p:active{transform:scale(0.97);}
  .btn-s{width:100%;height:48px;background:transparent;color:#c2c6d6;font-weight:600;font-size:14px;font-family:Inter,sans-serif;border:1px solid rgba(255,255,255,0.15);border-radius:12px;cursor:pointer;transition:all 0.15s;margin-top:10px;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
</style>
</head>
<body>
<!-- Background icon watermark -->
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;opacity:0.04;">
  <span style="font-size:240px;color:#ffb4ab;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">sensors_off</span>
</div>

<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(255,180,171,0.12);border:1px solid rgba(255,180,171,0.35);color:#ffb4ab;font-family:Inter,sans-serif;">
    <span style="width:7px;height:7px;border-radius:50%;background:#ffb4ab;display:inline-block;"></span>AI OFFLINE
  </div>
</header>

<main style="position:relative;z-index:10;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 96px;">
  <div class="glass slide-up" style="border-radius:24px;padding:36px 24px;max-width:420px;width:100%;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ffb4ab,transparent);"></div>

    <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,180,171,0.08);border:2px solid rgba(255,180,171,0.28);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 20px rgba(255,180,171,0.12);">
      <span style="font-size:36px;color:#ffb4ab;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">sensors_off</span>
    </div>

    <h2 style="font-size:22px;font-weight:800;color:#e2e2e2;margin:0 0 8px;">AI Processing Unavailable</h2>
    <p style="font-size:14px;color:#8c909f;line-height:1.6;margin:0 0 24px;">The vision AI backend is temporarily offline. Object detection and currency recognition require an AI connection to function.</p>

    <!-- Error Details -->
    <div style="background:rgba(255,180,171,0.06);border:1px solid rgba(255,180,171,0.15);border-radius:12px;padding:12px 14px;margin-bottom:24px;text-align:left;">
      <div style="font-size:10px;color:#ffb4ab;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Error Details</div>
      <code style="font-size:12px;color:#c2c6d6;font-family:monospace;">ERR: AI_SERVICE_UNAVAILABLE — Connection timeout after 30s</code>
    </div>

    <button onclick="window.location.href='retrying.html'" class="btn-p">
      <span style="font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;font-size:22px;">refresh</span>
      Try Reconnecting
    </button>
    <button onclick="window.location.href='env_mode.html'" class="btn-s">Resume Anyway</button>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn" onclick="window.location.href='alerts.html'">
    <span class="ms material-symbols-outlined">crisis_alert</span>Alerts
  </button>
  <button class="nav-btn" onclick="window.location.href='currency_mode.html'">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    const va = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
    setTimeout(() => va.speak('AI processing is unavailable. Tap Try Reconnecting to retry the connection.', 'high'), 500);
  }
});
</script>
</body>
</html>
