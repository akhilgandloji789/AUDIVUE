<style>
        body { background-color: #0B1220; min-height: max(884px, 100dvh); }
        .bg-electric-blue { background-color: #3b82f6; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="text-on-background font-body-md min-h-screen flex flex-col overflow-hidden relative">

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface-container-low backdrop-blur-xl border-b border-outline-variant flat no shadows">
<button onclick="window.location.href='index.html'" aria-label="Menu" class="flex items-center gap-2 text-primary dark:text-primary-fixed-dim hover:bg-on-surface-variant/10 rounded-full p-2 scale-95 duration-200">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-headline-lg text-headline-lg font-bold text-primary">AUDIVUE</span>
</button>
<div class="flex items-center justify-center px-4 py-2 bg-error/20 text-error rounded-full font-label-md border border-error/50 font-bold">
    ⏸ PAUSED
</div>
</header>

<!-- Main Canvas Area -->
<main class="flex-1 mt-touch-target-min mb-[164px] flex flex-col justify-center items-center px-margin-mobile relative">
<!-- Dark Placeholder for Camera -->
<div class="absolute inset-0 bg-surface z-0 flex items-center justify-center opacity-80">
<span class="material-symbols-outlined text-[120px] text-outline opacity-50">sensors_off</span>
</div>

<!-- Content Overlay Card -->
<div class="relative z-10 flex flex-col items-center justify-center text-center w-full max-w-md mx-auto p-gutter bg-surface-container/60 backdrop-blur-xl border border-outline-variant/30 rounded-2xl shadow-2xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-gap font-bold">AI processing unavailable</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8">An error occurred. Tap retry to attempt reconnection.</p>

<button onclick="window.location.href='env_mode.html'" class="w-full h-touch-target-min bg-electric-blue hover:bg-blue-600 text-white font-label-lg rounded-xl flex items-center justify-center gap-4 transition-all shadow-xl active:scale-95 font-bold">
<span class="material-symbols-outlined text-[32px]">replay</span>
<span>Resume Processing</span>
</button>
</div>
</main>

<!-- Audio Status Bar -->
<div class="fixed bottom-[100px] left-0 w-full bg-surface-container-high/80 backdrop-blur-sm border-t border-outline-variant py-3 px-margin-mobile flex items-center justify-between z-40 h-[64px]">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-[28px] text-primary">volume_up</span>
<span class="font-label-md text-label-md font-semibold">System Paused — Ready</span>
</div>
<div class="flex gap-1">
<div class="w-1.5 h-4 bg-primary rounded-full opacity-40"></div>
<div class="w-1.5 h-6 bg-primary rounded-full opacity-70"></div>
<div class="w-1.5 h-3 bg-primary rounded-full opacity-30"></div>
<div class="w-1.5 h-5 bg-primary rounded-full opacity-50"></div>
</div>
</div>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-[100px] pb-safe bg-surface border-t-2 border-outline-variant shadow-lg rounded-t-xl md:hidden">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-4 border-2 border-primary scale-98 transition-transform min-w-[80px]">
<span class="material-symbols-outlined text-[32px] mb-1" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="font-label-lg text-label-lg text-[14px] leading-tight font-bold">Vision</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright scale-98 transition-transform min-w-[80px]">
<span class="material-symbols-outlined text-[32px] mb-1">explore</span>
<span class="font-label-lg text-label-lg text-[14px] leading-tight font-normal">Explore</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright scale-98 transition-transform min-w-[80px]">
<span class="material-symbols-outlined text-[32px] mb-1">payments</span>
<span class="font-label-lg text-label-lg text-[14px] leading-tight font-normal">Currency</span>
</button>
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-4 hover:bg-surface-bright scale-98 transition-transform min-w-[80px]">
<span class="material-symbols-outlined text-[32px] mb-1">settings</span>
<span class="font-label-lg text-label-lg text-[14px] leading-tight font-normal">Settings</span>
</button>
</nav>

<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("AI processing unavailable. Tap resume to attempt reconnection.", "high");
        }, 500);
    });
</script>
</body>
</html>
