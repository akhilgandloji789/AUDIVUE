<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Processing Unavailable</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#adc6ff",
                      "primary-container": "#4d8eff",
                      "background": "#0B1220",
                      "surface": "#121414",
                      "surface-container": "#1e2020",
                      "error": "#ffb4ab",
                      "on-surface": "#e2e2e2",
                      "on-surface-variant": "#c2c6d6"
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
</style>
</head>
<body class="text-on-background font-body-md h-screen flex flex-col overflow-hidden relative">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container/90 backdrop-blur-xl border-b border-white/10">
<button onclick="window.location.href='index.html'" aria-label="Menu" class="flex items-center gap-3 text-primary hover:bg-white/5 rounded-full p-2">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-extrabold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</button>
<div class="flex items-center justify-center px-4 py-1.5 bg-error/20 text-error rounded-full font-bold text-xs border border-error/50">
    ⏸ PAUSED
</div>
</header>

<!-- Main Canvas Area -->
<main class="flex-1 mt-16 mb-24 flex flex-col justify-center items-center px-6 relative">
<!-- Dark Placeholder for Camera -->
<div class="absolute inset-0 bg-surface z-0 flex items-center justify-center opacity-80">
<span class="material-symbols-outlined text-[120px] text-outline opacity-40">sensors_off</span>
</div>

<!-- Content Overlay Card -->
<div class="relative z-10 glass-card rounded-3xl p-8 max-w-md w-full flex flex-col items-center text-center shadow-2xl border border-white/10">
<h2 class="text-3xl font-extrabold text-on-surface mb-3">AI Processing Unavailable</h2>
<p class="text-base text-on-surface-variant mb-8">An error occurred while connecting to the computer vision model. Tap resume to reconnect.</p>

<button onclick="window.location.href='env_mode.html'" class="w-full py-4 bg-primary-container hover:bg-primary-fixed text-on-primary-container font-extrabold text-lg rounded-2xl flex items-center justify-center gap-3 transition-all shadow-xl active:scale-95 border border-primary/40">
<span class="material-symbols-outlined text-2xl">replay</span>
<span>Resume Processing</span>
</button>
</div>
</main>

<!-- Audio Status Bar -->
<div class="fixed bottom-[96px] left-0 w-full bg-surface-container z-40 border-t border-white/10 py-3 px-6 flex items-center justify-between h-16 shadow-lg">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-2xl text-primary">volume_up</span>
<span class="text-sm font-bold">System Paused — Ready</span>
</div>
<div class="flex gap-1.5">
<div class="w-2 h-5 bg-primary rounded-full opacity-40"></div>
<div class="w-2 h-7 bg-primary rounded-full opacity-70"></div>
<div class="w-2 h-4 bg-primary rounded-full opacity-30"></div>
<div class="w-2 h-6 bg-primary rounded-full opacity-50"></div>
</div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="text-xs font-bold">Vision</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">payments</span>
<span class="text-xs font-semibold">Currency</span>
</button>
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-xs font-semibold">Settings</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("AI processing unavailable. Tap resume to attempt reconnection.", "high");
        }, 500);
    });
</script>
</body>
</html>
