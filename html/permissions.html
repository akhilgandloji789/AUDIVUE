<!DOCTYPE html>
<html class="dark" lang="en">
<head>

                        "error-container": "#93000a",
                        "secondary": "#d0bcff",
                        "on-primary-container": "#00285d",
                        "surface-container": "#1e2020",
                        "on-background": "#e2e2e2",
                        "outline-variant": "#424754",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-high": "#282a2b",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-tint": "#adc6ff",
                        "on-secondary-fixed": "#23005c",
                        "on-primary-fixed-variant": "#004395",
                        "on-surface-variant": "#c2c6d6",

                        "on-error": "#690005",

<style>
        body {
            background-color: #0B1220;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }
        
        .glass-card {
            background: rgba(18, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .focus-outline:focus {
            outline: 3px solid #3B82F6;
            outline-offset: 2px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="text-on-background flex flex-col min-h-screen relative overflow-x-hidden">
<!-- Ambient Background Glows -->
<div class="absolute top-0 left-1/4 w-96 h-96 bg-brand-blue rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none z-0"></div>
<div class="absolute bottom-0 right-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none z-0"></div>

<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-touch-target-min bg-surface dark:bg-surface sticky top-0 z-40">
<div class="flex items-center gap-4">
<span aria-hidden="true" class="material-symbols-outlined text-primary dark:text-primary text-[28px]">visibility</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary tracking-tight m-0">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-surface-variant flex items-center justify-center relative">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<span class="font-label-md text-label-md text-surface-variant">LIVE</span>
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant text-[28px] ml-2">sensors</span>
</div>
</header>

<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile py-8 z-10 relative pb-[140px]">
<div class="glass-card rounded-2xl w-full max-w-lg p-8 sm:p-10 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Subtle top border accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-brand-blue to-transparent opacity-50"></div>
<!-- Icon Group -->
<div class="flex items-center justify-center gap-6 mb-8 mt-4">
<div class="w-20 h-20 rounded-full bg-brand-blue/10 flex items-center justify-center relative group">
<div class="absolute inset-0 rounded-full bg-brand-blue/20 blur-md animate-pulse"></div>
<span aria-hidden="true" class="material-symbols-outlined text-brand-blue text-[48px] relative z-10" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<div class="w-4 h-4 rounded-full bg-surface-variant flex items-center justify-center">
<div class="w-2 h-2 bg-on-surface-variant rounded-full"></div>
</div>
<div class="w-20 h-20 rounded-full bg-brand-blue/10 flex items-center justify-center relative group">
<div class="absolute inset-0 rounded-full bg-brand-blue/20 blur-md animate-pulse" style="animation-delay: 0.5s;"></div>
<span aria-hidden="true" class="material-symbols-outlined text-brand-blue text-[48px] relative z-10" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Text Content -->
<h2 class="font-headline-md text-headline-md text-on-background mb-4">
                AUDIVUE needs your camera and microphone
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-sm mx-auto">
                To help you understand your surroundings, AUDIVUE needs access to your camera and microphone.
            </p>
<!-- Actions -->
<button id="btnAllowPermissions" class="w-full min-h-touch-target-min bg-brand-blue hover:bg-inverse-primary text-white font-label-lg text-label-lg rounded-xl transition-colors duration-200 focus-outline flex items-center justify-center gap-3 active:scale-[0.98]">
                Allow Camera &amp; Microphone
            </button>
<!-- Safe Area Fallback / Skip Context -->
<button onclick="window.location.href='voice_assistant/index.html'" class="mt-6 w-full min-h-touch-target-min border-2 border-outline-variant hover:bg-surface-bright text-on-surface font-label-md text-label-md rounded-xl transition-colors duration-200 focus-outline">
                Not right now
            </button>
</div>
</main>

<!-- BottomNavBar -->
<nav aria-label="Main Navigation" class="fixed bottom-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 min-h-[100px] bg-surface-container-low dark:bg-surface-container-low backdrop-blur-md shadow-md rounded-t-xl">
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-xl p-2 border-2 border-primary scale-95 active:scale-90 transition-all duration-300 w-24 h-20 focus-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] mb-1">check_circle</span>
<span class="font-label-md text-label-md text-sm">Ready</span>
</button>
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest rounded-xl scale-95 active:scale-90 transition-all duration-300 w-24 h-20 focus-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] mb-1">settings_slow_motion</span>
<span class="font-label-md text-label-md text-sm">Processing</span>
</button>
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest rounded-xl scale-95 active:scale-90 transition-all duration-300 w-24 h-20 focus-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] mb-1">volume_up</span>
<span class="font-label-md text-label-md text-sm">Speaking</span>
</button>
<button onclick="window.location.href='voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest rounded-xl scale-95 active:scale-90 transition-all duration-300 w-24 h-20 focus-outline">
<span aria-hidden="true" class="material-symbols-outlined text-[32px] mb-1">mic</span>
<span class="font-label-md text-label-md text-sm">Listening</span>
</button>
</nav>

<script>
    document.getElementById('btnAllowPermissions').addEventListener('click', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
        } catch (e) {
            console.log('Permission prompt or fallback:', e);
        }
        window.location.href = 'voice_assistant/index.html';
    });
</script>
</body>
</html>
