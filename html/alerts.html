<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Critical Safety Interrupt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#4d8eff",
                        "background": "#0B1220",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .alert-view {
            background-color: #0B1220;
            background-image: radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.3), transparent 80%), linear-gradient(to bottom, rgba(11, 18, 32, 0.85), rgba(11, 18, 32, 0.98));
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative">

<!-- Background Alert Overlay -->
<div class="absolute inset-0 alert-view z-0"></div>

<!-- Critical Safety Bounding Box Overlay -->
<div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
    <div class="border-4 border-error rounded-3xl w-4/5 h-1/2 animate-pulse shadow-[0_0_40px_rgba(255,180,171,0.6)] flex items-start p-6">
        <div class="bg-error-container text-on-error-container font-extrabold text-xl px-5 py-2.5 rounded-2xl shadow-xl border border-error/50 flex items-center gap-2">
            <span class="material-symbols-outlined text-2xl animate-bounce" style="font-variation-settings: 'FILL' 1;">warning</span>
            <span>🚨 CRITICAL HAZARD — IMMINENT OBSTACLE</span>
        </div>
    </div>
</div>

<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full z-50 absolute top-0 bg-background/90 backdrop-blur-md border-b-2 border-error/40">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-black text-2xl tracking-tight text-error">AUDIVUE ALERTS</span>
</div>
<div class="flex items-center gap-2 bg-error-container/50 px-4 py-1.5 rounded-full border border-error/50">
<span class="w-2.5 h-2.5 bg-error rounded-full animate-ping"></span>
<span class="text-xs font-extrabold text-on-error-container">SAFETY INTERRUPT</span>
</div>
</header>

<!-- Main Safety Alert Card -->
<main class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-end pb-32 px-6">
<div class="bg-error-container/95 backdrop-blur-2xl border-2 border-error rounded-3xl p-6 shadow-2xl pointer-events-auto w-full max-w-2xl mx-auto mb-4 flex items-center gap-6">
<div class="bg-error w-16 h-16 rounded-full flex items-center justify-center shrink-0 shadow-lg animate-bounce border border-white/20">
<span class="material-symbols-outlined text-on-error text-4xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="flex-1">
    <div class="text-xs text-on-error-container font-black uppercase tracking-wider mb-1">Preemptive Safety Override</div>
    <p class="text-xl text-on-error-container m-0 leading-relaxed font-black">
        "Warning! Open door and obstacle directly ahead, 2 feet!"
    </p>
</div>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t-2 border-error/30 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">visibility</span>
<span class="text-xs font-semibold">Vision</span>
</button>
<!-- Active Alerting -->
<button class="flex flex-col items-center justify-center bg-error-container text-on-error-container rounded-xl p-2 px-5 border border-error flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="text-xs font-bold">Alerting</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">payments</span>
<span class="text-xs font-semibold">Currency</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.1, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakObstacleAlert('Open door and obstacle', 'directly center', 'immediate', true);
        }, 400);
    });
</script>
</body>
</html>
