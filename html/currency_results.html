<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Currency Results</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#0B1220;min-height:100dvh;display:flex;flex-direction:column;font-family:Inter,sans-serif;}
  @keyframes slideUpAnim{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
  .slide-up{animation:slideUpAnim 0.5s cubic-bezier(0.16,1,0.3,1) both;}
  .top-bar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo-link .ms{font-size:26px;color:#adc6ff;font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:20px;font-weight:900;color:#adc6ff;margin:0;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;z-index:50;display:flex;align-items:center;justify-content:space-around;background:rgba(10,13,13,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:0 6px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:#6b7280;font-size:10px;font-weight:600;font-family:Inter,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer;transition:all 0.15s;}
  .nav-btn:hover{background:rgba(255,255,255,0.04);color:#c2c6d6;}
  .nav-btn.active{background:#adc6ff;color:#001a42;font-weight:700;}
  .nav-btn .ms{font-size:22px;font-family:'Material Symbols Outlined';}
  .note-chip{padding:10px 18px;border-radius:14px;background:rgba(168,85,247,0.18);border:1px solid rgba(168,85,247,0.5);font-size:18px;font-weight:800;color:#d0bcff;display:inline-flex;align-items:center;}
</style>
</head>
<body>
<header class="top-bar">
  <a class="logo-link" href="index.html">
    <span class="ms material-symbols-outlined">visibility</span>
    <h1>AUDIVUE</h1>
  </a>
  <button onclick="window.location.href='currency_mode.html'" style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);color:#34d399;cursor:pointer;font-family:Inter,sans-serif;">
    <span style="width:7px;height:7px;border-radius:50%;background:#34d399;display:inline-block;animation:pingDot 1.5s cubic-bezier(0,0,0.2,1) infinite;"></span>LIVE SCANNED
  </button>
</header>

<main style="flex:1;padding:24px 16px 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <div class="glass slide-up" style="border-radius:24px;padding:28px 24px;max-width:440px;width:100%;position:relative;overflow:hidden;" onclick="window.location.href='currency_final.html'" title="Tap to see final amount">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a855f7,#4d8eff,#a855f7);"></div>

    <!-- Header Row -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="ms material-symbols-outlined" style="font-size:28px;color:#a855f7;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">check_circle</span>
        <h2 style="font-size:20px;font-weight:800;color:#e2e2e2;margin:0;">3 Notes Detected</h2>
      </div>
      <span style="font-size:11px;font-weight:700;color:#a855f7;text-transform:uppercase;letter-spacing:0.06em;background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.3);padding:4px 10px;border-radius:12px;font-family:Inter,sans-serif;">Verified</span>
    </div>

    <!-- Note Chips -->
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;">
      <span class="note-chip">₹500</span>
      <span class="note-chip">₹200</span>
      <span class="note-chip">₹100</span>
    </div>

    <!-- Total Amount Display -->
    <div style="padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;">
        <div>
          <div style="font-size:11px;color:#8c909f;font-weight:600;margin-bottom:4px;">Calculated Total Value</div>
          <div style="font-size:13px;color:#a855f7;font-weight:600;">Tap card to view final breakdown →</div>
        </div>
        <div style="font-size:36px;font-weight:900;background:linear-gradient(135deg,#fff,#adc6ff,#d0bcff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.02em;">₹800</div>
      </div>
    </div>
  </div>

  <!-- Voice spoken confirmation -->
  <div style="max-width:440px;width:100%;margin-top:14px;background:rgba(14,18,30,0.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;">
    <span class="ms material-symbols-outlined" style="color:#4d8eff;font-size:22px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;animation:pAnim 2s ease-in-out infinite;">volume_up</span>
    <p style="font-size:13px;color:#c2c6d6;margin:0;font-weight:600;">"500, 200 and 100 rupees. Total is 800 rupees."</p>
  </div>
</main>

<style>
  @keyframes pingDot{75%,100%{transform:scale(2);opacity:0;}}
  @keyframes pAnim{0%,100%{opacity:1}50%{opacity:0.4}}
</style>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='env_mode.html'">
    <span class="ms material-symbols-outlined">visibility</span>Vision
  </button>
  <button class="nav-btn active">
    <span class="ms material-symbols-outlined">payments</span>Currency
  </button>
  <button class="nav-btn" onclick="window.location.href='currency_final.html'">
    <span class="ms material-symbols-outlined">summarize</span>Final Sum
  </button>
  <button class="nav-btn" onclick="window.location.href='audio_detected.html'">
    <span class="ms material-symbols-outlined">graphic_eq</span>Audio
  </button>
  <button class="nav-btn" onclick="window.location.href='../voice_assistant/index.html'">
    <span class="ms material-symbols-outlined">settings</span>Settings
  </button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (typeof AudivueVoiceAssistant !== 'undefined') {
    const va = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
    setTimeout(() => va.speakCurrencyAlert([500, 200, 100], 800), 500);
  }
});
</script>
</body>
</html>
