<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Currency Detection Results</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "secondary-container": "#571bc1",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up-card { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">

<!-- Background Camera View -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="webcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-30"></video>
</div>

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container/90 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-extrabold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2">
<button onclick="window.location.href='currency_mode.html'" class="px-4 py-1.5 bg-secondary-container text-on-secondary-container rounded-full text-xs font-bold border border-secondary/40 shadow">
    ● LIVE SCANNED
</button>
</div>
</header>

<!-- Slide-up Results Card -->
<main class="absolute bottom-[100px] left-0 w-full z-40 px-6 pb-6 slide-up-card">
<div onclick="window.location.href='currency_final.html'" class="glass-card rounded-3xl p-8 max-w-2xl mx-auto shadow-2xl flex flex-col gap-6 border border-white/10 cursor-pointer hover:border-primary transition-all">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    <h2 class="text-2xl font-bold text-on-surface">3 notes detected</h2>
</div>
<span class="text-xs text-primary font-bold uppercase tracking-wider bg-primary-container/20 px-3 py-1.5 rounded-full border border-primary/30">Verified</span>
</div>

<!-- Chips Breakdown -->
<div class="flex flex-wrap gap-3">
<div class="h-12 px-5 rounded-2xl bg-secondary-container text-on-secondary-container text-lg font-extrabold flex items-center border border-secondary shadow">
    ₹500
</div>
<div class="h-12 px-5 rounded-2xl bg-secondary-container text-on-secondary-container text-lg font-extrabold flex items-center border border-secondary shadow">
    ₹200
</div>
<div class="h-12 px-5 rounded-2xl bg-secondary-container text-on-secondary-container text-lg font-extrabold flex items-center border border-secondary shadow">
    ₹100
</div>
</div>

<!-- Prominent Total Display -->
<div class="pt-6 border-t border-white/10 flex justify-between items-end">
<span class="text-base text-on-surface-variant font-medium">Calculated Total Value</span>
<span class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-primary to-secondary">
    TOTAL: ₹800
</span>
</div>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">visibility</span>
<span class="text-xs font-semibold">Vision</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="text-xs font-bold">Currency</span>
</button>
<button onclick="window.location.href='currency_final.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">summarize</span>
<span class="text-xs font-semibold">Final Sum</span>
</button>
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-xs font-semibold">Settings</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('webcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakCurrencyAlert([500, 200, 100], 800);
        }, 500);
    });
</script>
</body>
</html>
