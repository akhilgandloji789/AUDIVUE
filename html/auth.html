<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Signing In...</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .glass-card {
            background: rgba(18, 20, 20, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .progress-bar-fill {
            animation: fillProgress 1.6s ease-in-out forwards;
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col justify-between relative overflow-hidden">

<!-- TopAppBar -->
<header class="w-full z-50 flex justify-between items-center px-6 h-16 border-b border-white/10 bg-background/80 backdrop-blur-md sticky top-0">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-bold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container px-3 py-1.5 rounded-full border border-primary/20">
<span class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-ping"></span>
<span class="text-xs font-bold text-amber-400 tracking-wider uppercase">AUTHENTICATING</span>
</div>
</header>

<!-- Main Authenticating Loading Content -->
<main class="flex-grow z-10 flex flex-col justify-center items-center px-6 py-12 relative">
<div class="glass-card rounded-3xl p-10 max-w-md w-full flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Top Glow Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-primary-container to-primary"></div>

<!-- Circular Spinner -->
<div class="relative w-20 h-20 mb-8 flex items-center justify-center">
    <div class="w-full h-full rounded-full border-4 border-primary/20 border-t-primary animate-spin"></div>
    <span class="material-symbols-outlined text-primary text-3xl absolute" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>

<h2 class="text-2xl font-bold text-on-surface mb-2">Signing in to AUDIVUE</h2>
<p class="text-on-surface-variant text-base mb-8">Authenticating your account credentials securely...</p>

<!-- Progress Bar Container -->
<div class="w-full bg-surface-container-low h-3 rounded-full overflow-hidden border border-white/10 p-0.5 mb-2">
    <div class="bg-gradient-to-r from-primary to-primary-container h-full rounded-full progress-bar-fill"></div>
</div>
<div class="text-xs text-primary font-mono tracking-wider">Verifying session...</div>
</div>
</main>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Signing in to AUDIVUE. Please wait.", "high");
        }, 300);

        // Auto transition to auth_success.html after 1.6s
        setTimeout(() => {
            window.location.href = 'auth_success.html';
        }, 1600);
    });
</script>
</body>
</html>
