<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — Signing In</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  @keyframes fillBar{from{width:0}to{width:100%}}
  .prog-fill{animation:fillBar 1.5s ease-in-out forwards;}
  @keyframes dashAnim{0%{stroke-dasharray:1,150;stroke-dashoffset:0}50%{stroke-dasharray:90,150;stroke-dashoffset:-35}100%{stroke-dasharray:90,150;stroke-dashoffset:-124}}
  .dash-ring{animation:dashAnim 1.5s ease-in-out infinite;}
  @keyframes spinAnim{to{transform:rotate(360deg)}}
  .spin-ring{animation:spinAnim 1.2s linear infinite;transform-origin:center;}
  .top-bar-fix{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-link .material-symbols-outlined{font-size:28px;color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:22px;font-weight:900;color:#adc6ff;letter-spacing:-0.02em;margin:0;}
</style>
</head>
<body style="background:#0B1220;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,sans-serif;">
<header class="top-bar-fix">
  <a class="logo-link" href="index.html"><span class="material-symbols-outlined">visibility</span><h1>AUDIVUE</h1></a>
  <div style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35);color:#f59e0b;"><span style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;"></span>SIGNING IN</div>
</header>
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="glass" style="border-radius:24px;padding:40px 28px;max-width:400px;width:100%;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4d8eff,#a855f7);"></div>
    <div style="position:relative;width:72px;height:72px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;">
      <svg class="spin-ring" width="72" height="72" viewBox="0 0 72 72" fill="none" style="position:absolute;inset:0;">
        <circle cx="36" cy="36" r="30" stroke="rgba(77,142,255,0.15)" stroke-width="5"/>
        <circle cx="36" cy="36" r="30" stroke="#4d8eff" stroke-width="5" stroke-linecap="round" class="dash-ring"/>
      </svg>
      <span class="material-symbols-outlined" style="position:relative;font-size:28px;color:#4d8eff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">lock</span>
    </div>
    <h2 style="font-size:22px;font-weight:800;color:#e2e2e2;margin:0 0 8px;">Signing in to AUDIVUE</h2>
    <p style="font-size:14px;color:#8c909f;margin:0 0 28px;line-height:1.5;">Authenticating your Google account securely...</p>
    <div style="height:6px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:10px;">
      <div class="prog-fill" style="height:100%;background:linear-gradient(90deg,#4d8eff,#a855f7);border-radius:6px;"></div>
    </div>
    <p style="font-size:11px;color:#4d8eff;font-weight:700;letter-spacing:0.08em;">VERIFYING SESSION...</p>
  </div>
</main>
<script src="../voice_assistant/voice_assistant.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof AudivueVoiceAssistant!=='undefined'){
    const va=new AudivueVoiceAssistant({rate:1.05,pitch:1.0});
    setTimeout(()=>va.speak('Signing in. Please wait.','high'),300);
  }
  setTimeout(()=>window.location.href='auth_success.html',1700);
});
</script>
</body>
</html>
