<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Currency Final Calculation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "secondary": "#d0bcff",
                        "secondary-container": "#571bc1",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">

<!-- Dimmed Camera Feed Background -->
<div class="absolute inset-0 z-0 flex items-center justify-center bg-[#0B1220]">
<div class="absolute inset-0 bg-surface/70 z-10 backdrop-blur-[2px]"></div>
<video id="finalWebcamFeed" autoplay playsinline muted class="object-cover w-full h-full opacity-40 mix-blend-luminosity"></video>
</div>

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container/90 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">visibility</span>
<h1 class="font-extrabold text-2xl text-primary tracking-tight">AUDIVUE</h1>
</div>
<div class="flex items-center gap-2 text-on-surface-variant text-sm font-bold">
<span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
<span>FINAL SUM</span>
</div>
</header>

<!-- Main Results Canvas -->
<main class="flex-grow z-10 pt-20 pb-32 flex flex-col items-center justify-center px-6 relative">
<!-- Results Card -->
<section class="glass-card rounded-3xl p-8 w-full max-w-md border border-white/10 shadow-2xl flex flex-col items-center justify-center space-y-6">
<div class="flex items-center space-x-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[#3b82f6] text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h2 class="text-sm text-on-surface tracking-wider uppercase font-extrabold">TOTAL AMOUNT</h2>
</div>

<!-- Prominent Total Value -->
<div class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-primary to-secondary tracking-tighter">
    ₹800
</div>

<!-- Breakdown Note Chips -->
<div class="flex flex-wrap justify-center gap-3 pt-4 border-t border-white/10 w-full">
<div class="bg-surface-container px-5 py-2.5 rounded-2xl border border-white/10 flex items-center shadow">
<span class="text-lg font-extrabold text-on-surface">₹500</span>
</div>
<div class="bg-surface-container px-5 py-2.5 rounded-2xl border border-white/10 flex items-center shadow">
<span class="text-lg font-extrabold text-on-surface">₹200</span>
</div>
<div class="bg-surface-container px-5 py-2.5 rounded-2xl border border-white/10 flex items-center shadow">
<span class="text-lg font-extrabold text-on-surface">₹100</span>
</div>
</div>
</section>

<!-- Count Again CTA Button -->
<div class="mt-8 w-full max-w-md">
<button onclick="window.location.href='currency_mode.html'" class="w-full h-touch-target-min bg-primary-container hover:bg-primary-fixed text-on-primary-container rounded-2xl font-bold text-lg flex items-center justify-center space-x-3 transition-all border border-primary/40 shadow-xl active:scale-95">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">refresh</span>
<span>Count Again</span>
</button>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">visibility</span>
<span class="text-xs font-semibold">Vision</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="text-xs font-bold">Currency</span>
</button>
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-xs font-semibold">Settings</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('finalWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak('Total count finalized: 800 rupees.', 'high');
        }, 500);
    });
</script>
</body>
</html>
