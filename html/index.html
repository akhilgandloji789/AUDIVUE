<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AUDIVUE — AI Vision Assistant</title>
<link rel="stylesheet" href="../assets/audivue.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  canvas#bgCanvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}
  .hero-card{position:relative;z-index:10;}
  .feature-chip{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);}
  .top-bar-fix{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-link .material-symbols-outlined{font-size:28px;color:#adc6ff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
  .logo-link h1{font-size:22px;font-weight:900;color:#adc6ff;letter-spacing:-0.02em;margin:0;}
  @keyframes waveAnim{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}
  .wave-bar{animation:waveAnim 1.2s ease-in-out infinite;transform-origin:bottom;}
  .btn-google{width:100%;height:56px;background:#4d8eff;color:#001a42;font-weight:700;font-size:16px;font-family:Inter,sans-serif;border:none;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all 0.15s;box-shadow:0 4px 20px rgba(77,142,255,0.3);}
  .btn-google:hover{background:#5a97ff;}
  .btn-google:active{transform:scale(0.97);}
  .orb1{position:fixed;top:-60px;left:-60px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(77,142,255,0.1),transparent 70%);pointer-events:none;z-index:1;}
  .orb2{position:fixed;bottom:-60px;right:-60px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.09),transparent 70%);pointer-events:none;z-index:1;}
  .status-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);color:#34d399;}
  .status-badge .dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pingDot 1.5s cubic-bezier(0,0,0.2,1) infinite;}
  @keyframes pingDot{75%,100%{transform:scale(2);opacity:0;}}
</style>
</head>
<body style="background:#0B1220;min-height:100vh;overflow-x:hidden;">
<canvas id="bgCanvas"></canvas>
<div class="orb1"></div>
<div class="orb2"></div>
<header class="top-bar-fix">
  <a class="logo-link" href="index.html"><span class="material-symbols-outlined">visibility</span><h1>AUDIVUE</h1></a>
  <div class="status-badge"><span class="dot"></span>AI READY</div>
</header>
<main style="position:relative;z-index:10;padding:28px 20px 60px;max-width:480px;margin:0 auto;">
  <div class="glass hero-card" style="border-radius:24px;padding:32px 24px 28px;text-align:center;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(77,142,255,0.18);">
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4d8eff,#a855f7,#4d8eff);"></div>
    <div style="width:80px;height:80px;border-radius:50%;background:rgba(77,142,255,0.12);border:2px solid rgba(77,142,255,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <g transform="translate(4,8)">
          <rect class="wave-bar" x="0" y="0" width="4" height="24" rx="2" fill="#4d8eff"/>
          <rect class="wave-bar" x="7" y="0" width="4" height="24" rx="2" fill="#6fa3ff" style="animation-delay:0.15s;"/>
          <rect class="wave-bar" x="14" y="0" width="4" height="24" rx="2" fill="#4d8eff" style="animation-delay:0.3s;"/>
          <rect class="wave-bar" x="21" y="0" width="4" height="24" rx="2" fill="#a855f7" style="animation-delay:0.1s;"/>
          <rect class="wave-bar" x="28" y="0" width="4" height="24" rx="2" fill="#4d8eff" style="animation-delay:0.25s;"/>
        </g>
      </svg>
    </div>
    <h2 style="font-size:28px;font-weight:900;color:#e2e2e2;letter-spacing:-0.02em;margin:0 0 8px;">AUDIVUE</h2>
    <p style="font-size:15px;color:#8c909f;line-height:1.6;margin:0 0 24px;">Real-time AI Vision &amp; Currency Detection for the visually impaired</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px;text-align:left;">
      <div class="feature-chip"><span class="material-symbols-outlined" style="font-size:22px;color:#4d8eff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">view_in_ar</span><div><div style="font-size:10px;color:#adc6ff;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Pipeline 1</div><div style="font-size:13px;color:#e2e2e2;font-weight:600;">Obstacle Vision</div></div></div>
      <div class="feature-chip"><span class="material-symbols-outlined" style="font-size:22px;color:#a855f7;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">payments</span><div><div style="font-size:10px;color:#d0bcff;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Pipeline 2</div><div style="font-size:13px;color:#e2e2e2;font-weight:600;">Currency Count</div></div></div>
      <div class="feature-chip"><span class="material-symbols-outlined" style="font-size:22px;color:#34d399;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">graphic_eq</span><div><div style="font-size:10px;color:#6ee7b7;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Audio</div><div style="font-size:13px;color:#e2e2e2;font-weight:600;">Voice Engine</div></div></div>
      <div class="feature-chip"><span class="material-symbols-outlined" style="font-size:22px;color:#f59e0b;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;">crisis_alert</span><div><div style="font-size:10px;color:#fcd34d;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Safety</div><div style="font-size:13px;color:#e2e2e2;font-weight:600;">Hazard Alerts</div></div></div>
    </div>
    <button onclick="window.location.href='auth.html'" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </button>
    <p style="margin-top:14px;font-size:12px;color:#6b7280;">Voice guidance activates automatically</p>
  </div>
</main>
<script src="../voice_assistant/voice_assistant.js"></script>
<script>
(function(){
  const c=document.getElementById('bgCanvas');
  const gl=c.getContext('webgl');if(!gl)return;
  function resize(){c.width=innerWidth;c.height=innerHeight;gl.viewport(0,0,c.width,c.height);}
  window.addEventListener('resize',resize);resize();
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
  const fs='precision highp float;uniform float t;uniform vec2 r;void main(){vec2 u=gl_FragCoord.xy/r;float w=sin(u.x*8.0+t*1.8)*0.08+0.5;float d=abs(u.y-w);vec3 c1=vec3(0.19,0.55,1.0);vec3 c2=vec3(0.66,0.33,0.97);vec3 col=mix(c1,c2,u.x);gl_FragColor=vec4(col*(0.015/(d+0.008)),0.7);}';
  function cs(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
  const pg=gl.createProgram();
  gl.attachShader(pg,cs(gl.VERTEX_SHADER,vs));
  gl.attachShader(pg,cs(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pg);gl.useProgram(pg);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const pa=gl.getAttribLocation(pg,'p');
  gl.enableVertexAttribArray(pa);gl.vertexAttribPointer(pa,2,gl.FLOAT,false,0,0);
  const ut=gl.getUniformLocation(pg,'t'),ur=gl.getUniformLocation(pg,'r');
  function draw(ms){gl.uniform1f(ut,ms*0.001);gl.uniform2f(ur,c.width,c.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw);}
  draw(0);
})();
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof AudivueVoiceAssistant!=='undefined'){
    const va=new AudivueVoiceAssistant({rate:1.05,pitch:1.0});
    setTimeout(()=>va.speak('Welcome to AUDIVUE. Tap Sign in with Google to start.','high'),700);
  }
});
</script>
</body>
</html>
