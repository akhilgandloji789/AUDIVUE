<style>
        body {
            background-color: #0B1220;
            min-height: max(884px, 100dvh);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="antialiased min-h-screen flex flex-col relative overflow-hidden text-on-background">
<!-- Dimmed Camera Feed Background -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="logoutWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-30"></video>
    <div class="absolute inset-0 bg-background/50 backdrop-blur-[20px]"></div>
</div>

<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile z-10 relative pb-[120px]">
<!-- Sign Out Card -->
<div class="w-full max-w-sm bg-surface/90 backdrop-blur-xl border border-white/10 rounded-2xl p-[24px] shadow-2xl flex flex-col items-center text-center">
<!-- Logo -->
<div class="mb-4 cursor-pointer" onclick="window.location.href='index.html'">
<span class="font-headline-md text-headline-md font-black tracking-tight text-primary uppercase">AUDIVUE</span>
</div>

<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-6 shadow-inner border border-white/5">
<span class="material-symbols-outlined text-4xl text-on-surface" style="font-variation-settings: 'FILL' 1;">logout</span>
</div>

<!-- Heading -->
<h1 class="font-headline-md text-headline-md text-on-background mb-4 font-bold">Log out of AUDIVUE?</h1>

<!-- Body Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8">
    You can sign back in anytime with Google.
</p>

<!-- Actions -->
<div class="w-full flex flex-col gap-stack-gap">
<!-- Primary Button (Log Out) -->
<button onclick="logoutUser()" class="w-full h-[touch-target-min] bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold rounded-xl hover:bg-primary-fixed transition-all focus:outline-none focus:ring-4 focus:ring-primary-container/50 flex items-center justify-center shadow-lg active:scale-95">
    Log Out
</button>

<!-- Secondary Button (Cancel) -->
<button onclick="window.location.href='env_mode.html'" class="w-full h-[touch-target-min] border-2 border-outline text-on-background font-label-lg text-label-lg font-semibold rounded-xl hover:bg-surface-variant transition-all focus:outline-none focus:ring-4 focus:ring-outline/50 flex items-center justify-center active:scale-95">
    Cancel
</button>
</div>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-4 bg-surface-container rounded-t-xl backdrop-blur-xl shadow-2xl border-t border-white/10">
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl h-[touch-target-min] px-6 border-2 border-primary hover:bg-surface-bright transition-transform duration-100 scale-95 opacity-90 focus:outline-none">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="font-label-md text-label-md font-bold">Ready</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl focus:outline-none">
<span class="material-symbols-outlined text-2xl mb-1">settings_suggest</span>
<span class="font-label-md text-label-md">Processing</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant h-[touch-target-min] px-6 hover:bg-surface-bright transition-colors rounded-xl focus:outline-none">
<span class="material-symbols-outlined text-2xl mb-1">volume_up</span>
<span class="font-label-md text-label-md">Speaking</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('logoutWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Log out of AUDIVUE? Tap Log Out to confirm.", "high");
        }, 500);
    });

    function logoutUser() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
