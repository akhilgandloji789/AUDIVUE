<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AUDIVUE - Sign Out Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "background": "#0B1220",
                        "surface": "#121414",
                        "surface-container": "#1e2020",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#c2c6d6"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1220; min-height: max(884px, 100dvh); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-card {
            background: rgba(18, 20, 20, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-hidden text-on-background">
<!-- Dimmed Camera Feed Background -->
<div class="absolute inset-0 z-0 bg-[#0B1220] flex items-center justify-center">
    <video id="logoutWebcamFeed" autoplay playsinline muted class="w-full h-full object-cover opacity-30"></video>
    <div class="absolute inset-0 bg-background/60 backdrop-blur-[20px]"></div>
</div>

<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-6 z-10 relative pb-28">
<!-- Sign Out Card -->
<div class="w-full max-w-sm glass-card rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center border border-white/10">
<!-- Logo -->
<div class="mb-4 cursor-pointer" onclick="window.location.href='index.html'">
<span class="font-black text-2xl tracking-tight text-primary uppercase">AUDIVUE</span>
</div>

<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-6 shadow-inner border border-white/10">
<span class="material-symbols-outlined text-4xl text-on-surface" style="font-variation-settings: 'FILL' 1;">logout</span>
</div>

<!-- Heading -->
<h1 class="text-2xl font-extrabold text-on-background mb-3">Log out of AUDIVUE?</h1>

<!-- Body Text -->
<p class="text-base text-on-surface-variant mb-8 leading-relaxed">
    You can sign back in anytime with Google.
</p>

<!-- Actions -->
<div class="w-full flex flex-col gap-3">
<!-- Primary Button (Log Out) -->
<button onclick="logoutUser()" class="w-full py-4 bg-primary-container text-on-primary-container font-extrabold text-lg rounded-2xl hover:bg-primary-fixed transition-all shadow-xl active:scale-95 border border-primary/40">
    Log Out
</button>

<!-- Secondary Button (Cancel) -->
<button onclick="window.location.href='env_mode.html'" class="w-full py-3.5 border border-white/20 text-on-background font-bold text-sm rounded-xl hover:bg-white/5 transition-all active:scale-95">
    Cancel
</button>
</div>
</div>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-24 bg-surface/95 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-t-2xl">
<button onclick="window.location.href='../voice_assistant/index.html'" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 px-5 border border-primary flex-1 shadow-lg">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="text-xs font-bold">Ready</span>
</button>
<button onclick="window.location.href='env_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">settings_suggest</span>
<span class="text-xs font-semibold">Processing</span>
</button>
<button onclick="window.location.href='currency_mode.html'" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container rounded-xl flex-1">
<span class="material-symbols-outlined text-2xl mb-1">volume_up</span>
<span class="text-xs font-semibold">Speaking</span>
</button>
</nav>

<script src="../voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('logoutWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Webcam fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speak("Log out of AUDIVUE? Tap Log Out to confirm.", "high");
        }, 500);
    });

    function logoutUser() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
