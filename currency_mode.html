</div>

<!-- Load Voice Assistant for Speech Synthesis -->
<script src="voice_assistant/voice_assistant.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('currencyWebcamFeed').srcObject = stream;
            }
        } catch (e) {
            console.log('Currency webcam preview fallback');
        }

        const assistant = new AudivueVoiceAssistant({ rate: 1.05, pitch: 1.0 });
        setTimeout(() => {
            assistant.speakCurrencyAlert([500, 200, 100], 800);
        }, 800);
    });
</script>
